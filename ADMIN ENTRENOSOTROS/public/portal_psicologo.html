  <!-- React 18 & ReactDOM & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Firebase App & Firestore -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #FAF7F5;
      color: #1C1917;
    }
    .custom-scroll::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: #F3EAE3;
      border-radius: 8px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #C6A487;
      border-radius: 8px;
    }
    .custom-scroll::-webkit-scrollbar-thumb:hover {
      background: #8C684B;
    }
    .login-bg-container {
      background-color: #EEF6FE;
      background-image: url('assets/FONDOLOGIANIMA.png');
      background-repeat: no-repeat;
      background-position: center center;
      background-size: 1820px 864px;
    }
    @media (max-width: 768px) {
      .login-bg-container {
        background-image: url('assets/FONDO%20ANIMA%20MOVIL.png') !important;

</head>
<body class="min-h-screen bg-coffee-50 text-coffee-900 antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // Configuración Firebase
    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyAs1ti_J3Fxi6t41kW_xC3OORk_PugyTSk",
      authDomain: "entre-nosotros-742c0.firebaseapp.com",
      projectId: "entre-nosotros-742c0",
      storageBucket: "entre-nosotros-742c0.firebasestorage.app",
      messagingSenderId: "67176257419",
      appId: "1:67176257419:web:c5e00b80c8f51aa428418e"
    };

    const COLLECTION_PSYCHOLOGISTS = 'psicologos';
    const COLLECTION_TOPICS = 'temas_psicologia';
    const STORAGE_SESSION = '@portal_psicologo_session_v2';

    let firestoreDb = null;
    try {
      if (typeof firebase !== 'undefined') {
        if (!firebase.apps || !firebase.apps.length) {
          firebase.initializeApp(FIREBASE_CONFIG);
        }
        firestoreDb = firebase.firestore();
      }
    } catch (err) {
      console.warn('Firebase error:', err);
    }

    // Iniciales para avatar fallback
    const getInitials = (name) => {
      if (!name || typeof name !== 'string') return 'PS';
      const parts = name.trim().split(/\s+/).filter(Boolean);
      if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
      return (parts[0]?.slice(0, 2) || 'PS').toUpperCase();
    };

    // Temas clínicos de referencia
    const DEFAULT_TOPICS_REF = [
      "Depresión", "Ansiedad", "Autoestima", "Duelo y Pérdida", "Estrés y Burnout",
      "Terapia de Pareja", "Terapia Familiar", "Terapia Infantil", "Trauma y Apego",
      "Dependencia Emocional", "Gestión de Emociones", "Trastornos de la Conducta Alimentaria (TCA)",
      "Orientación Vocacional", "Desarrollo Personal", "Crecimiento y Bienestar", "Habilidades Sociales"
    ];

    // Iconos SVG
    const Icon = ({ name, size = 18, className = "" }) => {
      switch (name) {
        case 'user':
          return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>;
        case 'edit':
          return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>;
        case 'feed':
          return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>;
        case 'logout':
          return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>;
        case 'check':
          return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="20 6 9 17 4 12"/></svg>;
        case 'image':
          return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>;
        case 'menu':
          return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>;
        case 'x':
          return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>;
        case 'shield':
          return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg>;
        case 'mapPin':
          return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>;
        case 'phone':
          return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>;
        case 'mail':
          return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>;
        case 'globe':
          return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>;
        case 'award':
          return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg>;
        case 'briefcase':
          return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>;
        case 'arrowLeft':
          return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>;
        case 'chat':
          return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>;
        case 'bookmark':
          return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>;
        case 'bookmarkFilled':
          return <svg width={size} height={size} viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>;
        case 'heart':
          return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>;
        case 'heartFilled':
          return <svg width={size} height={size} viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>;
        case 'send':
          return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>;
        case 'search':
          return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>;
        default:
          return null;
      }
    };

    // ========================================================================
    // COMPONENTE PRINCIPAL
    // ========================================================================
    function PortalApp() {
      const urlParams = useMemo(() => {
        const p = new URLSearchParams(window.location.search);
        return {
          id: p.get('id') || '',
          email: p.get('email') || '',
          token: p.get('token') || '',
        };
      }, []);

      const [currentPsico, setCurrentPsico] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_SESSION);
          if (saved) return JSON.parse(saved);
        } catch (e) {}
        return null;
      });

      // Menú lateral: perfil | publicar | feed
      const [activeTab, setActiveTab] = useState('perfil');
      const [mobileSidebarOpen, setMobileSidebarOpen] = useState(false);

      // Estados de Login
      const [loginEmail, setLoginEmail] = useState(urlParams.email || '');
      const [loginPassword, setLoginPassword] = useState('');
      const [loginError, setLoginError] = useState('');
      const [isLoggingIn, setIsLoggingIn] = useState(false);

      const handleLogin = async (e) => {
        e.preventDefault();
        setLoginError('');
        setIsLoggingIn(true);

        const emailClean = loginEmail.trim().toLowerCase();
        const passClean = loginPassword.trim();

        if (!emailClean || !passClean) {
          setLoginError('Ingresa correo y contraseña.');
          setIsLoggingIn(false);
          return;
        }

        try {
          let foundPsico = null;

          if (firestoreDb) {
            try {
              const querySnap = await firestoreDb
                .collection(COLLECTION_PSYCHOLOGISTS)
                .where('correo', '==', emailClean)
                .get();

              if (!querySnap.empty) {
                const docSnap = querySnap.docs[0];
                foundPsico = { id: docSnap.id, ...docSnap.data() };
              }
            } catch (err) {
              console.warn('Error buscando en Firestore:', err);
            }
          }

          if (!foundPsico) {
            try {
              const savedList = localStorage.getItem('@admin_entrenosotros_psychologists_list_v1');
              if (savedList) {
                const list = JSON.parse(savedList);
                foundPsico = list.find((p) => p.correo && p.correo.toLowerCase() === emailClean);
              }
            } catch (e) {}
          }

          if (!foundPsico) {
            foundPsico = {
              id: `psico_${Date.now()}`,
              nombre: emailClean.split('@')[0],
              correo: emailClean,
              especialidad: 'Psicología',
              cedula: '',
              modalidad: 'Presencial y En línea',
              temas: [],
              whatsapp: '',
              telefono: '',
              ciudad: '',
              sitioWeb: '',
              ubicacion: '',
              descripcion: '',
              imagen: '',
              fotoPortada: '',
              verificado: true,
              activo: true,
              createdAt: new Date().toISOString(),
            };

            if (firestoreDb) {
              try {
                await firestoreDb.collection(COLLECTION_PSYCHOLOGISTS).doc(foundPsico.id).set(foundPsico);
              } catch (e) {}
            }
          }

          localStorage.setItem(STORAGE_SESSION, JSON.stringify(foundPsico));
          setCurrentPsico(foundPsico);
          setIsLoggingIn(false);
        } catch (err) {
          setLoginError('Error de autenticación: ' + err.message);
          setIsLoggingIn(false);
        }
      };

      const handleLogout = () => {
        localStorage.removeItem(STORAGE_SESSION);
        setCurrentPsico(null);
      };

      const handleUpdatePsychologist = async (updatedData) => {
        const merged = { ...currentPsico, ...updatedData };

        setCurrentPsico(merged);
        localStorage.setItem(STORAGE_SESSION, JSON.stringify(merged));

        if (firestoreDb && merged.id) {
          try {
            await firestoreDb.collection(COLLECTION_PSYCHOLOGISTS).doc(merged.id).set(merged, { merge: true });
          } catch (e) {
            console.error('Error guardando en Firestore:', e);
          }
        }

        try {
          const raw = localStorage.getItem('@admin_entrenosotros_psychologists_list_v1');
          if (raw) {
            let list = JSON.parse(raw);
            const idx = list.findIndex(p => p.id === merged.id);
            if (idx >= 0) {
              list[idx] = merged;
            } else {
              list.push(merged);
            }
            localStorage.setItem('@admin_entrenosotros_psychologists_list_v1', JSON.stringify(list));
          }
        } catch (e) {}
      };

      // ======================================================================
      // VISTA DE LOGIN
      // ======================================================================
      if (!currentPsico) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4 relative overflow-hidden login-bg-container">
            <div className="max-w-sm w-full bg-white/95 backdrop-blur-sm rounded-3xl shadow-[0_12px_32px_rgba(43,74,111,0.12)] border border-blue-100 p-8 space-y-6 relative z-10">
              <div className="text-center space-y-2">
                <img
                  src="assets/logoappE.png"
                  alt="Entre Nosotros"
                  className="w-48 h-20 object-contain mx-auto"
                />
                <h1 className="text-xl font-extrabold text-coffee-900 tracking-tight">Portal del Psicólogo</h1>
                <p className="text-xs font-semibold text-coffee-600">Entre Nosotros</p>
              </div>

              {loginError && (
                <div className="p-3 bg-red-50 border border-red-200 text-red-700 text-xs rounded-xl font-medium">
                  {loginError}
                </div>
              )}

              <form onSubmit={handleLogin} className="space-y-4">
                <div>
                  <label className="block text-xs font-bold text-coffee-800 uppercase tracking-wider mb-1">
                    Correo Electrónico
                  </label>
                  <input
                    type="email"
                    value={loginEmail}
                    onChange={(e) => setLoginEmail(e.target.value)}
                    required
                    className="w-full px-3.5 py-2.5 text-sm bg-coffee-50 border border-coffee-200 rounded-xl focus:ring-2 focus:ring-coffee-600 focus:bg-white transition outline-none"
                  />
                </div>

                <div>
                  <label className="block text-xs font-bold text-coffee-800 uppercase tracking-wider mb-1">
                    Contraseña
                  </label>
                  <input
                    type="password"
                    value={loginPassword}
                    onChange={(e) => setLoginPassword(e.target.value)}
                    required
                    className="w-full px-3.5 py-2.5 text-sm bg-coffee-50 border border-coffee-200 rounded-xl focus:ring-2 focus:ring-coffee-600 focus:bg-white transition outline-none"
                  />
                </div>

                <button
                  type="submit"
                  disabled={isLoggingIn}
                  className="w-full py-2.5 bg-coffee-800 hover:bg-coffee-900 text-white font-bold text-sm rounded-xl shadow transition flex items-center justify-center gap-2"
                >
                  <Icon name="user" size={16} />
                  <span>{isLoggingIn ? 'Iniciando...' : 'Iniciar Sesión'}</span>
                </button>
              </form>
            </div>
          </div>
        );
      }

      // ======================================================================
      // PANEL CON BARRA LATERAL (SIDEBAR)
      // ======================================================================
      return (
        <div className="min-h-screen flex bg-coffee-50 text-coffee-900">
          {/* Backdrop móvil */}
          {mobileSidebarOpen && (
            <div
              onClick={() => setMobileSidebarOpen(false)}
              className="fixed inset-0 bg-black/40 z-40 md:hidden"
            />
          )}

          {/* BARRA LATERAL */}
          <aside
            className={`fixed inset-y-0 left-0 z-50 w-64 bg-white border-r border-coffee-200 flex flex-col justify-between transition-transform duration-200 ease-in-out md:translate-x-0 ${
              mobileSidebarOpen ? 'translate-x-0' : '-translate-x-full'
            }`}
          >
            {/* Parte Superior del Menú */}
            <div className="p-5 flex flex-col h-full">
              {/* Logo Oficial Centrado y Grande */}
              <div className="relative flex items-center justify-center pb-5 border-b border-coffee-200">
                <img
                  src="assets/logoappE.png"
                  alt="Entre Nosotros"
                  className="w-44 h-16 object-contain mx-auto"
                />
                <button
                  onClick={() => setMobileSidebarOpen(false)}
                  className="md:hidden absolute right-0 top-1 text-coffee-600 hover:text-coffee-900"
                >
                  <Icon name="x" size={20} />
                </button>
              </div>

              {/* Ficha compacta del psicólogo logueado */}
              <div className="my-4 p-3 bg-coffee-50 rounded-2xl border border-coffee-200 flex items-center gap-3">
                {currentPsico.imagen ? (
                  <img
                    src={currentPsico.imagen}
                    alt={currentPsico.nombre}
                    className="w-10 h-10 rounded-xl object-cover border border-coffee-300 flex-shrink-0"
                  />
                ) : (
                  <div className="w-10 h-10 rounded-xl bg-coffee-700 text-white font-bold text-xs flex items-center justify-center flex-shrink-0">
                    {getInitials(currentPsico.nombre)}
                  </div>
                )}
                <div className="min-w-0 flex-1">
                  <h3 className="font-bold text-xs text-coffee-900 truncate">{currentPsico.nombre || 'Especialista'}</h3>
                  <p className="text-[11px] text-coffee-500 truncate">{currentPsico.especialidad || 'Psicología'}</p>
                </div>
              </div>

              {/* Lista de Navegación: Perfil, Publicar Tema, Feed */}
              <nav className="space-y-1.5 flex-1">
                <button
                  onClick={() => {
                    setActiveTab('perfil');
                    setMobileSidebarOpen(false);
                  }}
                  className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-bold transition ${
                    activeTab === 'perfil'
                      ? 'bg-coffee-800 text-white shadow-sm'
                      : 'text-coffee-700 hover:bg-coffee-100'
                  }`}
                >
                  <Icon name="user" size={17} />
                  <span>Perfil</span>
                </button>

                <button
                  onClick={() => {
                    setActiveTab('publicar');
                    setMobileSidebarOpen(false);
                  }}
                  className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-bold transition ${

    // ========================================================================
    // VISTA DE PERFIL: TARJETA GRANDE DE PANTALLA COMPLETA + MODO EDICIÓN

    function ViewPerfilForm({ psychologist, onSave }) {
      const [isEditing, setIsEditing] = useState(false);

      const [nombre, setNombre] = useState(psychologist.nombre || '');
      const [especialidad, setEspecialidad] = useState(psychologist.especialidad || '');
      const [cedula, setCedula] = useState(psychologist.cedula || '');
      const [descripcion, setDescripcion] = useState(psychologist.descripcion || '');
      const [modalidad, setModalidad] = useState(psychologist.modalidad || 'Presencial y En línea');
      const [temas, setTemas] = useState(psychologist.temas || []);
      const [correo, setCorreo] = useState(psychologist.correo || '');
      const [whatsapp, setWhatsapp] = useState(psychologist.whatsapp || psychologist.telefono || '');
      const [ciudad, setCiudad] = useState(psychologist.ciudad || '');
      const [sitioWeb, setSitioWeb] = useState(psychologist.sitioWeb || '');
      const [ubicacion, setUbicacion] = useState(psychologist.ubicacion || '');
      const [imagen, setImagen] = useState(psychologist.imagen || '');
      const [fotoPortada, setFotoPortada] = useState(psychologist.fotoPortada || '');

      const [availableTopics, setAvailableTopics] = useState(DEFAULT_TOPICS_REF);
      const [topicInput, setTopicInput] = useState('');
      const [isSaving, setIsSaving] = useState(false);
      const [savedAlert, setSavedAlert] = useState(false);

      // Sincronizar cuando cambie el objeto psychologist externo
      useEffect(() => {
        setNombre(psychologist.nombre || '');
        setEspecialidad(psychologist.especialidad || '');
        setCedula(psychologist.cedula || '');
        setDescripcion(psychologist.descripcion || '');
        setModalidad(psychologist.modalidad || 'Presencial y En línea');
        setTemas(Array.isArray(psychologist.temas) ? psychologist.temas : []);
        setCorreo(psychologist.correo || '');
        setWhatsapp(psychologist.whatsapp || psychologist.telefono || '');
        setCiudad(psychologist.ciudad || '');
        setSitioWeb(psychologist.sitioWeb || '');
        setUbicacion(psychologist.ubicacion || '');
        setImagen(psychologist.imagen || '');
        setFotoPortada(psychologist.fotoPortada || '');
      }, [psychologist]);

      useEffect(() => {
        if (!firestoreDb) return;
        firestoreDb.collection(COLLECTION_TOPICS).get()
          .then((snap) => {
            const list = [...DEFAULT_TOPICS_REF];
            snap.forEach((doc) => {
              const t = doc.data().nombre;
              if (t && !list.includes(t)) {
                list.push(t);
              }
            });
            setAvailableTopics(list);
          })
          .catch((e) => console.warn('Error cargando temas:', e));
      }, []);

      const handleFileUpload = (e, setter) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          setter(event.target.result);
        };
        reader.readAsDataURL(file);
      };

      const handleAddTopic = (t) => {
        const clean = (t || topicInput).trim();
        if (!clean) return;
        if (!temas.includes(clean)) {
          setTemas([...temas, clean]);
          if (!availableTopics.includes(clean)) {
            setAvailableTopics([...availableTopics, clean]);
            if (firestoreDb) {
              const docId = clean.toLowerCase().replace(/[^a-z0-9]/g, '_');
              firestoreDb.collection(COLLECTION_TOPICS).doc(docId).set({
                nombre: clean,
                createdAt: new Date().toISOString()
              }).catch(() => {});
            }
          }
        }
        setTopicInput('');
      };

      const handleRemoveTopic = (index) => {
        setTemas(temas.filter((_, idx) => idx !== index));
      };

      const handleCancelEdit = () => {
        setNombre(psychologist.nombre || '');
        setEspecialidad(psychologist.especialidad || '');
        setCedula(psychologist.cedula || '');
        setDescripcion(psychologist.descripcion || '');
        setModalidad(psychologist.modalidad || 'Presencial y En línea');
        setTemas(Array.isArray(psychologist.temas) ? psychologist.temas : []);
        setCorreo(psychologist.correo || '');
        setWhatsapp(psychologist.whatsapp || psychologist.telefono || '');
        setCiudad(psychologist.ciudad || '');
        setSitioWeb(psychologist.sitioWeb || '');
        setUbicacion(psychologist.ubicacion || '');
        setImagen(psychologist.imagen || '');
        setFotoPortada(psychologist.fotoPortada || '');
        setIsEditing(false);
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        setIsSaving(true);

        const updated = {
          nombre: nombre.trim(),
          especialidad: especialidad.trim(),
          cedula: cedula.trim(),
          descripcion: descripcion.trim(),
          modalidad: modalidad,
          temas: temas,
          correo: correo.trim(),
          whatsapp: whatsapp.trim(),
          telefono: whatsapp.trim(),
          ciudad: ciudad.trim(),
          sitioWeb: sitioWeb.trim(),
          ubicacion: ubicacion.trim(),
          imagen: imagen.trim(),
          fotoPortada: fotoPortada.trim(),
          verificado: true,
          activo: true,
          perfilCompleto: true,
        };

        await onSave(updated);
        setIsSaving(false);
        setIsEditing(false);
        setSavedAlert(true);
        setTimeout(() => setSavedAlert(false), 4500);
      };

      const displayNombre = (psychologist.nombre || nombre || 'Especialista Clínico').trim();
      const displayEspecialidad = (psychologist.especialidad || especialidad || 'Psicología Clínica y Salud Emocional').trim();
      const displayCedula = (psychologist.cedula || cedula || '').trim();
      const displayModalidad = (psychologist.modalidad || modalidad || 'Presencial y En línea').trim();
      const displayDescripcion = (psychologist.descripcion || descripcion || '').trim();
      const displayTemas = Array.isArray(psychologist.temas) && psychologist.temas.length > 0 ? psychologist.temas : temas;
      const displayCorreo = (psychologist.correo || correo || '').trim();
      const displayWhatsapp = (psychologist.whatsapp || psychologist.telefono || whatsapp || '').trim();
      const displayCiudad = (psychologist.ciudad || ciudad || '').trim();

      const displayPortada = (psychologist.fotoPortada || fotoPortada || '').trim();

                  <button

    const formatTimeAgoApp = (timestamp, createdAt) => {
      let ts = Number(timestamp);
      if (!ts && createdAt) {
        const parsed = Date.parse(createdAt);
        if (!isNaN(parsed)) ts = parsed;
      }
      if (!ts) return 'Ahora';
      const diffMs = Date.now() - ts;
      const diffMins = Math.floor(diffMs / 60000);
      if (diffMins < 1) return 'Ahora';
      if (diffMins < 60) return `Hace ${diffMins} min`;
      const diffHours = Math.floor(diffMins / 60);
      if (diffHours < 24) return `Hace ${diffHours} h`;
      const diffDays = Math.floor(diffHours / 24);
      return `Hace ${diffDays} d`;
    };

    const isVideoMediaUrl = (url) => {
      if (!url || typeof url !== 'string') return false;
      const lower = url.toLowerCase();
      return (
        lower.includes('.mp4') ||
        lower.includes('.mov') ||
        lower.includes('.webm') ||
        lower.includes('.m4v') ||
        lower.includes('video/') ||
        lower.includes('video%2f') ||
        lower.startsWith('data:video')
      );
    };

    // ========================================================================
    // VISOR DE IMÁGENES A PANTALLA COMPLETA (LIGHTBOX IGUAL A LA APP)
    // ========================================================================
    function FeedImageLightbox({ images, initialIndex = 0, onClose }) {
      const [index, setIndex] = useState(initialIndex);

      useEffect(() => {
        setIndex(initialIndex);
      }, [initialIndex]);

      if (!images || images.length === 0) return null;
      const currentUrl = images[index] || images[0];

      return (
        <div
          className="fixed inset-0 z-[120] bg-black/90 backdrop-blur-sm flex flex-col items-center justify-center p-4"
          onClick={onClose}
        >
          {/* Barra superior del visor */}
          <div
            className="w-full max-w-5xl flex items-center justify-between text-white mb-3 px-2"
            onClick={(e) => e.stopPropagation()}
          >
            <span className="text-xs font-bold bg-white/15 px-3 py-1 rounded-full">
              {index + 1} / {images.length}
            </span>
            <button
              type="button"
              onClick={onClose}
              className="w-9 h-9 rounded-full bg-white/15 hover:bg-white/25 flex items-center justify-center text-white transition"
            >
              <Icon name="x" size={18} />
            </button>
          </div>

          {/* Contenedor de imagen o video */}
          <div
            className="relative max-w-4xl w-full max-h-[82vh] flex items-center justify-center"
            onClick={(e) => e.stopPropagation()}
          >
            {images.length > 1 && (
              <button
                type="button"
                onClick={() => setIndex((prev) => (prev - 1 + images.length) % images.length)}
                className="absolute left-2 z-10 w-10 h-10 rounded-full bg-black/60 hover:bg-black/80 text-white font-extrabold text-xl flex items-center justify-center"
              >
                ‹
              </button>
            )}

            {isVideoMediaUrl(currentUrl) ? (
              <video
                src={currentUrl}
                controls
                autoPlay
                className="max-h-[80vh] max-w-full rounded-2xl shadow-2xl"
              />
            ) : (
              <img
                src={currentUrl}
                alt="Vista completa"
                className="max-h-[80vh] max-w-full object-contain rounded-2xl shadow-2xl"
              />
            )}

            {images.length > 1 && (
              <button
                type="button"
                onClick={() => setIndex((prev) => (prev + 1) % images.length)}
                className="absolute right-2 z-10 w-10 h-10 rounded-full bg-black/60 hover:bg-black/80 text-white font-extrabold text-xl flex items-center justify-center"
              >
                ›
              </button>
            )}
          </div>
        </div>
      );
    }

    // ========================================================================
    // RENDERIZADO MULTIMEDIA CON PROPORCIONES REALES (IGUAL A PostMediaView)
    // ========================================================================
    function FeedPostMediaView({ mediaUrls = [], onMediaPress }) {
      if (!Array.isArray(mediaUrls) || mediaUrls.length === 0) return null;
      const count = mediaUrls.length;

      // 1 sola imagen o video
      if (count === 1) {
        const url = mediaUrls[0];
        if (isVideoMediaUrl(url)) {
          return (
            <div className="my-2.5 rounded-2xl overflow-hidden bg-black max-h-[460px] flex items-center justify-center border border-[#EDE3DA]">
              <video
                src={url}
                controls
                className="w-full max-h-[450px] object-contain"
              />
            </div>
          );
        }
        return (
          <div className="my-2.5">
            <div
              onClick={() => onMediaPress && onMediaPress(mediaUrls, 0)}
              className="rounded-2xl overflow-hidden border border-[#EDE3DA] bg-[#F7F2EE] cursor-pointer inline-block max-w-full"
            >
              <img
                src={url}
                alt="Publicación"
                className="max-h-[440px] w-auto max-w-full object-contain block mx-auto hover:scale-[1.01] transition-transform duration-200"
              />
            </div>
          </div>
        );
      }

      // 2 imágenes lado a lado
      if (count === 2) {
        return (
          <div className="my-2.5 grid grid-cols-2 gap-1.5 rounded-2xl overflow-hidden">
            {mediaUrls.slice(0, 2).map((url, idx) => (
              <div
                key={idx}
                onClick={() => onMediaPress && onMediaPress(mediaUrls, idx)}
                className="relative h-60 bg-[#F7F2EE] overflow-hidden cursor-pointer border border-[#EDE3DA] rounded-xl"
              >
                <img src={url} alt="" className="w-full h-full object-cover hover:scale-105 transition duration-200" />
              </div>
            ))}
          </div>
        );
      }

      // 3 imágenes (1 grande a la izquierda + 2 apiladas a la derecha)
      if (count === 3) {
        return (
          <div className="my-2.5 grid grid-cols-2 gap-1.5 h-72 rounded-2xl overflow-hidden">
            <div
              onClick={() => onMediaPress && onMediaPress(mediaUrls, 0)}
              className="relative h-full bg-[#F7F2EE] overflow-hidden cursor-pointer border border-[#EDE3DA] rounded-xl"
            >
              <img src={mediaUrls[0]} alt="" className="w-full h-full object-cover hover:scale-105 transition duration-200" />
            </div>
            <div className="grid grid-rows-2 gap-1.5 h-full">
              {mediaUrls.slice(1, 3).map((url, idx) => (
                <div
                  key={idx}
                  onClick={() => onMediaPress && onMediaPress(mediaUrls, idx + 1)}
                  className="relative h-full bg-[#F7F2EE] overflow-hidden cursor-pointer border border-[#EDE3DA] rounded-xl"
                >
                  <img src={url} alt="" className="w-full h-full object-cover hover:scale-105 transition duration-200" />
                </div>
              ))}
            </div>
          </div>
        );
      }

      // 4 o más imágenes (cuadrícula 2x2)
      return (
        <div className="my-2.5 grid grid-cols-2 gap-1.5 rounded-2xl overflow-hidden">
          {mediaUrls.slice(0, 4).map((url, idx) => {
            const extra = count - 4;
            return (
              <div
                key={idx}
                onClick={() => onMediaPress && onMediaPress(mediaUrls, idx)}
                className="relative h-48 bg-[#F7F2EE] overflow-hidden cursor-pointer border border-[#EDE3DA] rounded-xl"
              >
                <img src={url} alt="" className="w-full h-full object-cover hover:scale-105 transition duration-200" />
                {idx === 3 && extra > 0 && (
                  <div className="absolute inset-0 bg-black/55 flex items-center justify-center text-white font-extrabold text-lg">
                    +{extra}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      );
    }

    // ========================================================================
    // TARJETA DE PUBLICACIÓN IDÉNTICA A LA APP (PostCard.tsx)
    // ========================================================================
    function FeedPostCard({
      post,
      currentUserId,
      liveAvatars = {},
      onReact,
      onToggleSave,
      onOpenComments,
      onSelectHashtag,
      onOpenMedia,
    }) {
      const [showPicker, setShowPicker] = useState(false);

      const userReactionType = currentUserId ? post.userReactions?.[currentUserId] : undefined;
      const activeReactionConfig = userReactionType ? APP_REACTIONS_MAP[userReactionType] : null;
      const isSaved = currentUserId && Array.isArray(post.savedBy) ? post.savedBy.includes(currentUserId) : false;

      const totalReactions =
        (post.reactions?.teAbrazo || 0) +
        (post.reactions?.teEscucho || 0) +
        (post.reactions?.noEstasSolo || 0) +
        (post.reactions?.fuerza || 0);

      const resolvedAvatar =
        liveAvatars[post.authorId] ||
        post.authorAvatarUrl ||
        `https://api.dicebear.com/7.x/adventurer/svg?seed=${encodeURIComponent(post.authorUsername || post.authorId || 'user')}`;

      return (
        <div className="bg-white px-5 pt-4 pb-2 relative transition hover:bg-[#FDFCFB]">
          {/* Selector Flotante de las 4 Reacciones de Entre Nosotros */}
          {showPicker && (
            <div
              className="absolute bottom-12 left-4 z-40 bg-white rounded-full px-3 py-2 shadow-[0_10px_30px_rgba(46,36,35,0.22)] border border-[#EDE3DA] flex items-center gap-2 animate-fade-in"
              onMouseLeave={() => setShowPicker(false)}
            >
              {Object.values(APP_REACTIONS_MAP).map((r) => {
                const isSelected = userReactionType === r.type;
                return (
                  <button
                    key={r.type}
                    type="button"
                    onClick={() => {
                      onReact(post, r.type);
                      setShowPicker(false);
                    }}
                    className={`group flex flex-col items-center px-2.5 py-1 rounded-2xl transition transform hover:-translate-y-1 hover:scale-110 ${
                      isSelected ? 'bg-[#F5EFEA] ring-1 ring-[#C6A487]' : ''
                    }`}
                    title={r.label}
                  >
                    <img
                      src={r.image}
                      alt={r.label}
                      className="w-8 h-8 object-contain"
                    />
                    <span
                      className="text-[10px] font-extrabold mt-0.5 whitespace-nowrap"
                      style={{ color: r.color }}
                    >
                      {r.label}
                    </span>
                  </button>
                );
              })}
            </div>
          )}

          {/* Cabecera: Avatar, @username y Tiempo */}
          <div className="flex items-center justify-between mb-2.5">
            <div className="flex items-center gap-2.5 min-w-0">
              <img
                src={resolvedAvatar}
                alt={post.authorUsername}
                className="w-[38px] h-[38px] rounded-full object-cover bg-[#F7F2EE] border border-[#EDE3DA] flex-shrink-0"
              />
              <div className="min-w-0">
                <div className="text-[13.5px] font-bold text-[#2E2423] leading-tight truncate">
                  @{post.authorUsername || 'usuario'}
                </div>
                <div className="text-[11px] text-[#9A8B82] mt-0.5">
                  {formatTimeAgoApp(post.timestamp, post.createdAt)}
                </div>
              </div>
            </div>
          </div>

          {/* Cuerpo: Texto de la publicación */}
          {post.content && (
            <p className="text-[14px] text-[#2E2423] leading-[20.5px] mb-1.5 whitespace-pre-line break-words">
              {post.content}
            </p>
          )}

          {/* Imágenes o Videos */}
          <FeedPostMediaView
            mediaUrls={post.imageUrls}
            onMediaPress={onOpenMedia}
          />

          {/* Hashtags clickeables */}
          {Array.isArray(post.hashtags) && post.hashtags.length > 0 && (
            <div className="flex flex-wrap gap-1.5 mt-2 mb-1">
              {post.hashtags.map((tag, idx) => {
                const formatted = tag.startsWith('#') ? tag : `#${tag}`;
                return (
                  <button
                    key={idx}
                    type="button"
                    onClick={() => onSelectHashtag && onSelectHashtag(formatted)}
                    className="text-[12.5px] font-semibold text-[#6F5038] hover:underline mr-1"
                  >
                    {formatted}
                  </button>
                );
              })}
            </div>
          )}

          {/* Contador de Reacciones con Círculos Superpuestos (Igual que en la App) */}
          {totalReactions > 0 && (
            <div className="flex items-center mt-2 mb-1">
              <div className="flex items-center mr-2">
                {post.reactions?.teAbrazo > 0 && (
                  <div
                    className="w-5 h-5 rounded-full flex items-center justify-center border-[1.5px] border-white -mr-1.5 shadow-sm overflow-hidden"
                    style={{ backgroundColor: APP_REACTIONS_MAP.teAbrazo.bgColor }}
                  >
                    <img src={APP_REACTIONS_MAP.teAbrazo.image} alt="Te abrazo" className="w-3.5 h-3.5 object-contain" />
                  </div>
                )}
                {post.reactions?.teEscucho > 0 && (
                  <div
                    className="w-5 h-5 rounded-full flex items-center justify-center border-[1.5px] border-white -mr-1.5 shadow-sm overflow-hidden"
                    style={{ backgroundColor: APP_REACTIONS_MAP.teEscucho.bgColor }}
                  >
                    <img src={APP_REACTIONS_MAP.teEscucho.image} alt="Te escucho" className="w-3.5 h-3.5 object-contain" />
                  </div>
                )}
                {post.reactions?.noEstasSolo > 0 && (
                  <div
                    className="w-5 h-5 rounded-full flex items-center justify-center border-[1.5px] border-white -mr-1.5 shadow-sm overflow-hidden"
                    style={{ backgroundColor: APP_REACTIONS_MAP.noEstasSolo.bgColor }}
                  >
                    <img src={APP_REACTIONS_MAP.noEstasSolo.image} alt="No estás solo" className="w-3.5 h-3.5 object-contain" />
                  </div>
                )}
                {post.reactions?.fuerza > 0 && (
                  <div
                    className="w-5 h-5 rounded-full flex items-center justify-center border-[1.5px] border-white -mr-1.5 shadow-sm overflow-hidden"
                    style={{ backgroundColor: APP_REACTIONS_MAP.fuerza.bgColor }}
                  >
                    <img src={APP_REACTIONS_MAP.fuerza.image} alt="Fuerza" className="w-3.5 h-3.5 object-contain" />
                  </div>
                )}
              </div>
              <span className="text-[11.5px] font-semibold text-[#6F5E56] ml-2">
                {totalReactions}
              </span>
            </div>
          )}

          {/* Barra de Acciones: Reaccionar | Dejar unas palabras | Guardar */}
          <div className="flex items-center justify-between py-2 mt-1">
            {/* 1. Botón de Reacción (Clic directo o selector de las 4 reacciones) */}
            <div
              className="relative flex items-center"
              onMouseEnter={() => setShowPicker(true)}
            >
              <button
                type="button"
                onClick={() => onReact(post, userReactionType || 'teAbrazo')}
                onContextMenu={(e) => {
                  e.preventDefault();
                  setShowPicker((prev) => !prev);
                }}
                className="flex items-center gap-1.5 py-1.5 px-2.5 rounded-xl hover:bg-[#F7F2EE] transition"
              >
                {activeReactionConfig ? (
                  <img
                    src={activeReactionConfig.image}
                    alt={activeReactionConfig.label}
                    className="w-[22px] h-[22px] object-contain"
                  />
                ) : (
                  <img
                    src={APP_REACTIONS_MAP.teAbrazo.image}
                    alt="Te abrazo"
                    className="w-[22px] h-[22px] object-contain opacity-50"
                  />
                )}
                <span
                  className="text-[11.5px] font-medium"
                  style={
                    activeReactionConfig
                      ? { color: activeReactionConfig.color, fontWeight: 700 }
                      : { color: '#6F5E56' }
                  }
                >
                  {activeReactionConfig ? activeReactionConfig.label : 'Te abrazo'}
                </span>
              </button>
            </div>

            {/* 2. Botón Dejar unas palabras (Comentarios) */}
            <button
              type="button"
              onClick={() => onOpenComments(post)}
              className="flex items-center gap-1.5 py-1.5 px-2.5 rounded-xl hover:bg-[#F7F2EE] text-[#6F5E56] transition"
            >
              <Icon name="chat" size={17} />
              <span className="text-[11.5px] font-medium">
                Dejar unas palabras {post.commentsCount > 0 ? `(${post.commentsCount})` : ''}
              </span>
            </button>

            {/* 3. Botón Guardar */}
            <button
              type="button"
              onClick={() => onToggleSave(post)}
              className={`flex items-center gap-1.5 py-1.5 px-2.5 rounded-xl hover:bg-[#F7F2EE] transition ${
                isSaved ? 'text-[#6F5038] font-bold' : 'text-[#6F5E56] font-medium'
              }`}
            >
              <Icon name={isSaved ? 'bookmarkFilled' : 'bookmark'} size={17} />
              <span className="text-[11.5px]">
                {isSaved ? 'Guardado' : 'Guardar'}
              </span>
            </button>
          </div>

          {/* Separador fino igual que en la App */}
          <div className="h-[1px] bg-[#EDE3DA] w-full mt-1" />
        </div>
      );
    }

    // ========================================================================
    // MODAL DE COMENTARIOS ("DEJAR UNAS PALABRAS" - IDÉNTICO A CommentsScreen.tsx)
    // ========================================================================
    function FeedCommentsModal({ post, psychologist, liveAvatars = {}, onClose, onOpenMedia }) {
      const [comments, setComments] = useState([]);
      const [commentText, setCommentText] = useState('');
      const [attachedImage, setAttachedImage] = useState(null);
      const [isSending, setIsSending] = useState(false);
      const [isLoading, setIsLoading] = useState(true);

      const psicoId = psychologist?.id || 'psico_especialista';
      const psicoDisplayName = psychologist?.nombre
        ? `Psic. ${psychologist.nombre.replace(/^Psic\.?\s*/i, '')}`
        : 'Especialista Clínico';
      const psicoAvatar =
        psychologist?.imagen ||
        `https://api.dicebear.com/7.x/initials/svg?seed=${encodeURIComponent(psicoDisplayName)}`;

      useEffect(() => {
        if (!post || !firestoreDb) {
          setIsLoading(false);
          return;
        }
        setIsLoading(true);
        const unsub = firestoreDb
          .collection(`posts/${post.id}/comments`)
          .orderBy('timestamp', 'asc')
          .onSnapshot(
            (snap) => {
              const list = [];
              snap.forEach((docSnap) => {
                list.push({ id: docSnap.id, ...docSnap.data() });
              });
              setComments(list);
              setIsLoading(false);
            },
            (err) => {
              console.warn('Error cargando comentarios:', err);
              setIsLoading(false);
            }
          );
        return () => unsub();
      }, [post?.id]);

      const handlePickCommentImage = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          setAttachedImage(ev.target.result);
        };
        reader.readAsDataURL(file);
      };

      const handleSendComment = async (e) => {
        e.preventDefault();
        if ((!commentText.trim() && !attachedImage) || !post || !firestoreDb) return;

        setIsSending(true);
        try {
          const commentId = 'comment_' + Date.now() + '_' + Math.random().toString(36).substring(2, 6);
          const newComment = {
            id: commentId,
            postId: post.id,
            authorId: psicoId,
            authorUsername: psicoDisplayName,
            authorAvatarUrl: psicoAvatar,
            text: commentText.trim(),
            authorHeart: false,
            createdAt: new Date().toISOString(),
            timestamp: Date.now(),
          };

          if (attachedImage) {
            newComment.imageUrl = attachedImage;
          }

          await firestoreDb
            .collection(`posts/${post.id}/comments`)
            .doc(commentId)
            .set(newComment);

          await firestoreDb
            .collection('posts')
            .doc(post.id)
            .update({
              commentsCount: firebase.firestore.FieldValue.increment(1),
            });

          setCommentText('');
          setAttachedImage(null);
        } catch (err) {
          console.error('Error al enviar comentario:', err);
          alert('No se pudo publicar tu comentario. Verifica tu conexión.');
        } finally {
          setIsSending(false);
        }
      };

      const handleToggleHeart = async (comment) => {
        if (!post || !firestoreDb) return;
        try {
          await firestoreDb
            .collection(`posts/${post.id}/comments`)
            .doc(comment.id)
            .update({
              authorHeart: !comment.authorHeart,
            });
        } catch (err) {
          console.warn('Error al actualizar corazón:', err);
        }
      };

      if (!post) return null;

      const postAuthorAvatar =
        liveAvatars[post.authorId] ||
        post.authorAvatarUrl ||
        `https://api.dicebear.com/7.x/adventurer/svg?seed=${encodeURIComponent(post.authorUsername || 'user')}`;

      return (
        <div
          className="fixed inset-0 z-[100] bg-black/55 backdrop-blur-xs flex items-center justify-center p-3 sm:p-5"
          onClick={onClose}
        >
          <div
            className="w-full max-w-2xl bg-[#FAF7F5] rounded-3xl border border-[#EDE3DA] shadow-2xl overflow-hidden flex flex-col max-h-[88vh]"
            onClick={(e) => e.stopPropagation()}
          >
            {/* Barra superior igual que CommentsScreen */}
            <div className="bg-white px-5 py-3.5 border-b border-[#EDE3DA] flex items-center justify-between">
              <button
                type="button"
                onClick={onClose}
                className="p-1.5 rounded-xl text-[#2E2423] hover:bg-[#F5EFEA] transition"
              >
                <Icon name="arrowLeft" size={20} />
              </button>
              <h3 className="text-[15px] font-extrabold text-[#2E2423]">
                Dejar unas palabras
              </h3>
              <div className="w-8" />
            </div>

            {/* Lista scrolleable con contexto de la publicación original + comentarios */}
            <div className="flex-1 overflow-y-auto p-4 sm:p-5 space-y-3 custom-scroll">
              {/* Tarjeta de contexto de la publicación original */}
              <div className="bg-white rounded-2xl p-4 border border-[#EDE3DA]">
                <div className="flex items-center gap-2.5 mb-2">
                  <img
                    src={postAuthorAvatar}
                    alt={post.authorUsername}
                    className="w-9 h-9 rounded-full object-cover border border-[#EDE3DA]"
                  />
                  <div>
                    <div className="text-xs font-extrabold text-[#2E2423]">
                      @{post.authorUsername || 'usuario'}
                    </div>
                    <div className="text-[10.5px] font-semibold text-[#9A8B82]">
                      Publicación original
                    </div>
                  </div>
                </div>

                {post.content && (
                  <p className="text-xs text-[#4A3E3D] leading-relaxed whitespace-pre-line">
                    {post.content}
                  </p>
                )}

                {Array.isArray(post.imageUrls) && post.imageUrls.length > 0 && (
                  <div className="flex gap-2 mt-2.5 overflow-x-auto pb-1">
                    {post.imageUrls.map((url, idx) => (
                      <img
                        key={idx}
                        src={url}
                        alt=""
                        onClick={() => onOpenMedia && onOpenMedia(post.imageUrls, idx)}
                        className="w-16 h-16 rounded-xl object-cover border border-[#EDE3DA] cursor-pointer hover:opacity-90"
                      />
                    ))}
                  </div>
                )}

                <div className="h-[1px] bg-[#EDE3DA] my-3" />
                <div className="text-xs font-extrabold text-[#6F5038]">
                  Palabras de la comunidad ({comments.length})
                </div>
              </div>

              {/* Estado cargando o vacío */}
              {isLoading ? (
                <div className="py-10 text-center text-xs font-semibold text-[#9A8B82]">
                  Cargando palabras de apoyo...
                </div>
              ) : comments.length === 0 ? (
                <div className="bg-white rounded-2xl p-8 border border-[#EDE3DA] text-center space-y-1">
                  <p className="text-sm font-bold text-[#4A3E3D]">
                    Sé la primera persona en dejar unas palabras de empatía
                  </p>
                  <p className="text-xs text-[#9A8B82]">
                    Tu respuesta como especialista brinda acompañamiento valioso a la comunidad.
                  </p>
                </div>
              ) : (
                comments.map((item) => {
                  const commentAvatar =
                    liveAvatars[item.authorId] ||
                    item.authorAvatarUrl ||
                    `https://api.dicebear.com/7.x/adventurer/svg?seed=${encodeURIComponent(item.authorUsername || 'user')}`;
                  const isPsicoComment =
                    String(item.authorId || '').startsWith('psico_') ||
                    String(item.authorUsername || '').toLowerCase().startsWith('psic.');

                  return (
                    <div
                      key={item.id}
                      className="bg-white rounded-2xl p-3.5 border border-[#EDE3DA] flex items-start gap-3"
                    >
                      <img
                        src={commentAvatar}
                        alt={item.authorUsername}
                        className="w-8 h-8 rounded-full object-cover border border-[#EDE3DA] flex-shrink-0 mt-0.5"
                      />
                      <div className="flex-1 min-w-0">
                        <div className="flex items-center justify-between gap-2">
                          <div className="flex items-center gap-1.5 flex-wrap">
                            <span className="text-xs font-extrabold text-[#2E2423]">
                              @{item.authorUsername}
                            </span>
                            {isPsicoComment && (
                              <span className="px-2 py-0.5 rounded-full text-[9.5px] font-extrabold bg-emerald-50 text-emerald-700 border border-emerald-200">
                                Especialista
                              </span>
                            )}
                          </div>
                          <span className="text-[10px] text-[#9A8B82]">
                            {formatTimeAgoApp(item.timestamp, item.createdAt)}
                          </span>
                        </div>

                        {item.text && (
                          <p className="text-[13px] text-[#2E2423] leading-relaxed mt-1 whitespace-pre-line break-words">
                            {item.text}
                          </p>
                        )}

                        {item.imageUrl && (
                          <img
                            src={item.imageUrl}
                            alt="Adjunto"
                            onClick={() => onOpenMedia && onOpenMedia([item.imageUrl], 0)}
                            className="mt-2 max-h-44 rounded-xl object-cover border border-[#EDE3DA] cursor-pointer"
                          />
                        )}
                      </div>

                      <button
                        type="button"
                        onClick={() => handleToggleHeart(item)}
                        className={`p-1.5 rounded-full transition ${
                          item.authorHeart ? 'text-rose-500' : 'text-[#C6B8AE] hover:text-rose-400'
                        }`}
                        title="Dar corazón a este comentario"
                      >
                        <Icon name={item.authorHeart ? 'heartFilled' : 'heart'} size={15} />
                      </button>
                    </div>
                  );
                })
              )}
            </div>

            {/* Previsualización de imagen adjunta al comentario */}
            {attachedImage && (
              <div className="px-5 py-2 bg-white border-t border-[#EDE3DA] flex items-center gap-3">
                <div className="relative">
                  <img
                    src={attachedImage}
                    alt="Adjunto"
                    className="w-14 h-14 rounded-xl object-cover border border-[#EDE3DA]"
                  />
                  <button
                    type="button"
                    onClick={() => setAttachedImage(null)}
                    className="absolute -top-1.5 -right-1.5 w-5 h-5 rounded-full bg-red-600 text-white text-xs flex items-center justify-center"
                  >
                    ×
                  </button>
                </div>
                <span className="text-xs font-semibold text-[#6F5E56]">
                  Imagen lista para enviar
                </span>
              </div>
            )}

            {/* Barra inferior para escribir comentario como Psicólogo */}
            <form
              onSubmit={handleSendComment}
              className="bg-white px-4 py-3 border-t border-[#EDE3DA] flex items-center gap-2.5"
            >
              <img
                src={psicoAvatar}
                alt={psicoDisplayName}
                className="w-8 h-8 rounded-full object-cover border border-[#EDE3DA] flex-shrink-0 hidden sm:block"
              />

              {/* Botón para adjuntar foto */}
              <label
                className="p-2 rounded-xl text-[#6F5038] hover:bg-[#F5EFEA] cursor-pointer transition flex-shrink-0"
                title="Adjuntar imagen"
              >
                <Icon name="image" size={19} />
                <input
                  type="file"
                  accept="image/*"
                  onChange={handlePickCommentImage}
                  className="hidden"
                />
              </label>

              <input
                type="text"
                value={commentText}
                onChange={(e) => setCommentText(e.target.value)}
                placeholder={`Escribe unas palabras de apoyo como ${psicoDisplayName}...`}
                className="flex-1 text-xs sm:text-sm px-4 py-2.5 rounded-full bg-[#F7F2EE] border border-[#EDE3DA] focus:outline-none focus:ring-2 focus:ring-[#8C684B] focus:bg-white text-[#2E2423]"
              />

              <button
                type="submit"
                disabled={isSending || (!commentText.trim() && !attachedImage)}
                className="w-10 h-10 rounded-full bg-[#6F5038] hover:bg-[#4A3E3D] disabled:opacity-40 text-white flex items-center justify-center transition shadow-sm flex-shrink-0"
                title="Enviar palabras"
              >
                <Icon name="send" size={16} />
              </button>
            </form>
          </div>
        </div>
      );
    }

    // ========================================================================
    // MÓDULO FEED COMPLETO PARA EL PSICÓLOGO (CONECTADO EN TIEMPO REAL A LA APP)
    // ========================================================================
    function ViewCommunityFeed({ psychologist }) {
      const [posts, setPosts] = useState([]);
      const [isLoading, setIsLoading] = useState(true);
      const [liveAvatars, setLiveAvatars] = useState({});
      const [searchQuery, setSearchQuery] = useState('');
      const [activeHashtag, setActiveHashtag] = useState(null);
      const [feedFilter, setFeedFilter] = useState('all'); // 'all' | 'saved'
      const [activeCommentPostId, setActiveCommentPostId] = useState(null);
      const [lightboxState, setLightboxState] = useState({ visible: false, images: [], index: 0 });

      const currentUserId = psychologist?.id || 'psico_especialista';

      // 1. Suscripción en tiempo real a todas las publicaciones de los usuarios (colección `posts`)
      useEffect(() => {
        if (!firestoreDb) {
          setIsLoading(false);
          return;
        }

        const unsubPosts = firestoreDb
          .collection('posts')
          .orderBy('timestamp', 'desc')
          .limit(100)
          .onSnapshot(
            (snapshot) => {
              const list = [];
              snapshot.forEach((docSnap) => {
                list.push({ id: docSnap.id, ...docSnap.data() });
              });
              setPosts(list);
              setIsLoading(false);
            },
            () => {
              // Fallback sin orderBy si falta índice
              firestoreDb
                .collection('posts')
                .limit(100)
                .onSnapshot((snap) => {
                  const list = [];
                  snap.forEach((docSnap) => list.push({ id: docSnap.id, ...docSnap.data() }));
                  list.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                  setPosts(list);
                  setIsLoading(false);
                });
            }
          );

        // 2. Suscripción en tiempo real a `users` para sincronizar avatares actualizados
        const unsubUsers = firestoreDb
          .collection('users')
          .onSnapshot(
            (snap) => {
              const map = {};
              snap.forEach((docSnap) => {
                const d = docSnap.data() || {};
                if (d.avatarUrl) {
                  map[docSnap.id] = d.avatarUrl;
                }
              });
              setLiveAvatars(map);
            },
            () => {}
          );

        return () => {
          unsubPosts();
          unsubUsers();
        };
      }, []);

      // 3. Reaccionar a una publicación (idéntico a togglePostReaction en postsService.ts)
      const handleReactToPost = async (post, reactionType) => {
        if (!firestoreDb || !post?.id) return;
        try {
          const postRef = firestoreDb.collection('posts').doc(post.id);
          const snap = await postRef.get();
          if (!snap.exists) return;

          const postData = snap.data() || {};
          const userReactions = { ...(postData.userReactions || {}) };
          const currentReaction = userReactions[currentUserId];
          const reactions = {
            teEscucho: 0,
            teAbrazo: 0,
            noEstasSolo: 0,
            fuerza: 0,
            ...(postData.reactions || {}),
          };

          if (currentReaction === reactionType) {
            delete userReactions[currentUserId];
            reactions[reactionType] = Math.max(0, (reactions[reactionType] || 1) - 1);
          } else {
            if (currentReaction && reactions[currentReaction] !== undefined) {
              reactions[currentReaction] = Math.max(0, (reactions[currentReaction] || 1) - 1);
            }
            userReactions[currentUserId] = reactionType;
            reactions[reactionType] = (reactions[reactionType] || 0) + 1;
          }

          await postRef.update({
            reactions,
            userReactions,
          });
        } catch (err) {
          console.error('Error al reaccionar a la publicación:', err);
        }
      };

      // 4. Guardar / Quitar de guardados (idéntico a toggleSavePost en postsService.ts)
      const handleToggleSavePost = async (post) => {
        if (!firestoreDb || !post?.id) return;
        try {
          const postRef = firestoreDb.collection('posts').doc(post.id);
          const snap = await postRef.get();
          if (!snap.exists) return;

          const postData = snap.data() || {};
          const savedBy = Array.isArray(postData.savedBy) ? [...postData.savedBy] : [];
          const idx = savedBy.indexOf(currentUserId);
          if (idx > -1) {
            savedBy.splice(idx, 1);
          } else {
            savedBy.push(currentUserId);
          }
          await postRef.update({ savedBy });
        } catch (err) {
          console.error('Error al guardar publicación:', err);
        }
      };

      // Filtrado por búsqueda, hashtag o guardados
      const filteredPosts = useMemo(() => {
        return posts.filter((p) => {
          if (feedFilter === 'saved') {
            if (!Array.isArray(p.savedBy) || !p.savedBy.includes(currentUserId)) return false;
          }
          if (activeHashtag) {
            const tags = (p.hashtags || []).map((t) => (t.startsWith('#') ? t.toLowerCase() : `#${t.toLowerCase()}`));
            if (!tags.includes(activeHashtag.toLowerCase())) return false;
          }
          if (searchQuery.trim()) {
            const q = searchQuery.trim().toLowerCase();
            const matchContent = (p.content || '').toLowerCase().includes(q);
            const matchAuthor = (p.authorUsername || '').toLowerCase().includes(q);
            const matchTag = (p.hashtags || []).some((t) => t.toLowerCase().includes(q));
            return matchContent || matchAuthor || matchTag;
          }
          return true;
        });
      }, [posts, feedFilter, activeHashtag, searchQuery, currentUserId]);

      const activeCommentPost = useMemo(() => {
        if (!activeCommentPostId) return null;
        return posts.find((p) => p.id === activeCommentPostId) || null;
      }, [posts, activeCommentPostId]);

      return (
        <div className="w-full max-w-2xl mx-auto flex-1 flex flex-col gap-4">
          {/* Visor de imágenes en pantalla completa */}
          {lightboxState.visible && (
            <FeedImageLightbox
              images={lightboxState.images}
              initialIndex={lightboxState.index}
              onClose={() => setLightboxState({ visible: false, images: [], index: 0 })}
            />
          )}

          {/* Modal de Comentarios ("Dejar unas palabras") */}
          {activeCommentPost && (
            <FeedCommentsModal
              post={activeCommentPost}
              psychologist={psychologist}
              liveAvatars={liveAvatars}
              onClose={() => setActiveCommentPostId(null)}
              onOpenMedia={(imgs, idx) => setLightboxState({ visible: true, images: imgs, index: idx })}
            />
          )}

          {/* Cabecera del Feed estilo App Entre Nosotros */}
          <div className="bg-white rounded-3xl px-5 py-4 border border-[#EDE3DA] shadow-sm space-y-3">
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
              <div>
                <h1 className="text-lg font-extrabold text-[#2E2423] tracking-tight">
                  Comunidad Entre Nosotros
                </h1>
                <p className="text-xs text-[#8C7A70] font-medium">
                  Publicaciones en tiempo real de los usuarios • Reacciona o deja palabras de apoyo
                </p>
              </div>

              {/* Pestañas Todas / Guardadas */}
              <div className="inline-flex bg-[#F7F2EE] p-1 rounded-2xl border border-[#EDE3DA] self-start">
                <button
                  type="button"
                  onClick={() => setFeedFilter('all')}
                  className={`px-3.5 py-1.5 rounded-xl text-xs font-bold transition ${
                    feedFilter === 'all'
                      ? 'bg-[#2E2423] text-white shadow-xs'
                      : 'text-[#6F5E56] hover:text-[#2E2423]'
                  }`}
                >
                  Recientes ({posts.length})
                </button>
                <button
                  type="button"
                  onClick={() => setFeedFilter('saved')}
                  className={`px-3.5 py-1.5 rounded-xl text-xs font-bold transition ${
                    feedFilter === 'saved'
                      ? 'bg-[#2E2423] text-white shadow-xs'
                      : 'text-[#6F5E56] hover:text-[#2E2423]'
                  }`}
                >
                  Guardados
                </button>
              </div>
            </div>

            {/* Buscador y filtro de hashtag activo */}
            <div className="flex items-center gap-2">
              <div className="flex-1 relative">
                <span className="absolute left-3.5 top-1/2 -translate-y-1/2 text-[#9A8B82]">
                  <Icon name="search" size={15} />
                </span>
                <input
                  type="text"
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  placeholder="Buscar por usuario, palabra o #hashtag..."
                  className="w-full pl-9 pr-4 py-2 rounded-2xl bg-[#FAF7F5] border border-[#EDE3DA] text-xs font-medium text-[#2E2423] focus:outline-none focus:ring-2 focus:ring-[#8C684B] focus:bg-white"
                />
              </div>

              {activeHashtag && (
                <button
                  type="button"
                  onClick={() => setActiveHashtag(null)}
                  className="inline-flex items-center gap-1.5 px-3 py-2 rounded-2xl bg-[#6F5038] text-white text-xs font-bold"
                >
                  <span>{activeHashtag}</span>
                  <span>×</span>
                </button>
              )}
            </div>
          </div>

          {/* Contenedor del Feed de Publicaciones (Idéntico al Feed de la App) */}
          <div className="bg-white rounded-3xl border border-[#EDE3DA] shadow-sm overflow-hidden">
            {isLoading ? (
              <div className="py-16 text-center space-y-2">
                <div className="w-8 h-8 border-2 border-[#6F5038] border-t-transparent rounded-full animate-spin mx-auto" />
                <p className="text-xs font-bold text-[#8C7A70]">
                  Sincronizando publicaciones de la comunidad...
                </p>
              </div>
            ) : filteredPosts.length === 0 ? (
              <div className="py-16 px-6 text-center space-y-2">
                <p className="text-sm font-extrabold text-[#2E2423]">
                  No se encontraron publicaciones
                </p>
                <p className="text-xs text-[#8C7A70]">
                  {feedFilter === 'saved'
                    ? 'Aún no has guardado publicaciones de la comunidad.'
                    : 'Todavía no hay publicaciones que coincidan con tu filtro.'}
                </p>
              </div>
            ) : (
              filteredPosts.map((post) => (
                <FeedPostCard
                  key={post.id}
                  post={post}
                  currentUserId={currentUserId}
                  liveAvatars={liveAvatars}
                  onReact={handleReactToPost}
                  onToggleSave={handleToggleSavePost}
                  onOpenComments={(p) => setActiveCommentPostId(p.id)}
                  onSelectHashtag={(tag) => setActiveHashtag(tag === activeHashtag ? null : tag)}
                  onOpenMedia={(imgs, idx) => setLightboxState({ visible: true, images: imgs, index: idx })}
                />
              ))
            )}
          </div>
        </div>
      );
    }

    ReactDOM.render(<PortalApp />, document.getElementById('root'));
  </script>
</body>
</html>
