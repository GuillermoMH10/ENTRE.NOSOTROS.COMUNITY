<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal del Psicólogo | Entre Nosotros</title>
  <link rel="icon" type="image/png" href="https://iili.io/nlMffqB.png">

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#F0FDF4',
              100: '#DCFCE7',
              200: '#BBF7D0',
              300: '#86EFAC',
              400: '#4ADE80',
              500: '#22C55E',
              600: '#16A34A',
              700: '#15803D',
              800: '#166534',
              900: '#14532D',
            },
            coffee: {
              50: '#FAF7F5',
              100: '#F3EAE3',
              200: '#E5D5C8',
              300: '#C6A487',
              400: '#A88365',
              500: '#8C684B',
              600: '#6F5038',
              700: '#4A3E3D',
              800: '#2E2423',
              900: '#1C1917',
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          }
        }
      }
    };
  </script>

  <!-- React 18 & ReactDOM & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Firebase App & Firestore -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #FAF7F5;
      color: #1C1917;
    }
    .custom-scroll::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: #F3EAE3;
      border-radius: 8px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #C6A487;
      border-radius: 8px;
    }
    .custom-scroll::-webkit-scrollbar-thumb:hover {
      background: #8C684B;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col bg-coffee-50 text-coffee-900 antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // ------------------------------------------------------------------------
    // CONFIGURACIÓN DE FIREBASE (PROYECTO: ENTRE NOSOTROS)
    // ------------------------------------------------------------------------
    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyAs1ti_J3Fxi6t41kW_xC3OORk_PugyTSk",
      authDomain: "entre-nosotros-742c0.firebaseapp.com",
      projectId: "entre-nosotros-742c0",
      storageBucket: "entre-nosotros-742c0.firebasestorage.app",
      messagingSenderId: "67176257419",
      appId: "1:67176257419:web:c5e00b80c8f51aa428418e"
    };

    const COLLECTION_PSYCHOLOGISTS = 'psicologos';
    const COLLECTION_TOPICS = 'temas_psicologia';
    const STORAGE_SESSION = '@portal_psicologo_session_v2';

    let firestoreDb = null;
    try {
      if (typeof firebase !== 'undefined') {
        if (!firebase.apps || !firebase.apps.length) {
          firebase.initializeApp(FIREBASE_CONFIG);
        }
        firestoreDb = firebase.firestore();
      }
    } catch (err) {
      console.warn('Firebase error:', err);
    }

    // Iniciales seguras
    const getInitials = (name) => {
      if (!name || typeof name !== 'string') return 'PS';
      const parts = name.trim().split(/\s+/).filter(Boolean);
      if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
      return (parts[0]?.slice(0, 2) || 'PS').toUpperCase();
    };

    // Temas por defecto de referencia clínica (de registro_psicologos.html)
    const DEFAULT_TOPICS_REF = [
      "Depresión", "Ansiedad", "Autoestima", "Duelo y Pérdida", "Estrés y Burnout",
      "Terapia de Pareja", "Terapia Familiar", "Terapia Infantil", "Trauma y Apego",
      "Dependencia Emocional", "Gestión de Emociones", "Trastornos de la Conducta Alimentaria (TCA)",
      "Orientación Vocacional", "Desarrollo Personal", "Crecimiento y Bienestar", "Habilidades Sociales"
    ];

    // Iconos SVG limpios
    const Icon = ({ name, size = 18, className = "" }) => {
      switch (name) {
        case 'user':
          return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>;
        case 'eye':
          return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>;
        case 'share':
          return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>;
        case 'logout':
          return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>;
        case 'check':
          return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="20 6 9 17 4 12"/></svg>;
        case 'copy':
          return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>;
        case 'phone':
          return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>;
        case 'location':
          return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>;
        case 'mail':
          return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>;
        case 'globe':
          return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>;
        case 'sparkles':
          return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>;
        case 'quote':
          return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 21c3 0 7-1 7-8V5c0-1.25-.756-2.017-2-2H4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .008-1 1.031V20c0 1 0 1 1 1z"/><path d="M15 21c3 0 7-1 7-8V5c0-1.25-.757-2.017-2-2h-4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .008-1 1.031V20c0 1 0 1 1 1z"/></svg>;
        default:
          return null;
      }
    };

    // ========================================================================
    // COMPONENTE PRINCIPAL DEL PORTAL
    // ========================================================================
    function PortalApp() {
      // 1. Obtener parámetros de URL
      const urlParams = useMemo(() => {
        const p = new URLSearchParams(window.location.search);
        return {
          id: p.get('id') || '',
          email: p.get('email') || '',
          token: p.get('token') || '',
        };
      }, []);

      // 2. Sesión activa
      const [currentPsico, setCurrentPsico] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_SESSION);
          if (saved) return JSON.parse(saved);
        } catch (e) {}
        return null;
      });

      // 3. Pestaña activa (EXCLUSIVAMENTE: perfil | vista_previa | compartir)
      const [activeTab, setActiveTab] = useState('perfil');

      // 4. Estados de Login
      const [loginEmail, setLoginEmail] = useState(urlParams.email || '');
      const [loginPassword, setLoginPassword] = useState('');
      const [loginError, setLoginError] = useState('');
      const [isLoggingIn, setIsLoggingIn] = useState(false);

      // Manejador de Login
      const handleLogin = async (e) => {
        e.preventDefault();
        setLoginError('');
        setIsLoggingIn(true);

        const emailClean = loginEmail.trim().toLowerCase();
        const passClean = loginPassword.trim();

        if (!emailClean || !passClean) {
          setLoginError('Por favor completa todos los campos.');
          setIsLoggingIn(false);
          return;
        }

        try {
          let foundPsico = null;

          // Buscar primero en Firestore
          if (firestoreDb) {
            try {
              const querySnap = await firestoreDb
                .collection(COLLECTION_PSYCHOLOGISTS)
                .where('correo', '==', emailClean)
                .get();

              if (!querySnap.empty) {
                const docSnap = querySnap.docs[0];
                foundPsico = { id: docSnap.id, ...docSnap.data() };
              }
            } catch (err) {
              console.warn('Error buscando en Firestore:', err);
            }
          }

          // Si no se encuentra en Firestore, verificar en localStorage de la app
          if (!foundPsico) {
            try {
              const savedList = localStorage.getItem('@admin_entrenosotros_psychologists_list_v1');
              if (savedList) {
                const list = JSON.parse(savedList);
                foundPsico = list.find((p) => p.correo && p.correo.toLowerCase() === emailClean);
              }
            } catch (e) {}
          }

          // Si no existe, crear registro inicial con nombre y correo
          if (!foundPsico) {
            foundPsico = {
              id: `psico_${Date.now()}`,
              nombre: emailClean.split('@')[0],
              correo: emailClean,
              especialidad: 'Psicología',
              modalidad: 'Presencial y En línea',
              temas: [],
              whatsapp: '',
              telefono: '',
              ciudad: '',
              sitioWeb: '',
              ubicacion: '',
              descripcion: '',
              imagen: '',
              fotoPortada: '',
              verificado: true,
              activo: true,
              perfilCompleto: false,
              createdAt: new Date().toISOString(),
            };

            if (firestoreDb) {
              try {
                await firestoreDb.collection(COLLECTION_PSYCHOLOGISTS).doc(foundPsico.id).set(foundPsico);
              } catch (e) {}
            }
          }

          // Guardar sesión
          localStorage.setItem(STORAGE_SESSION, JSON.stringify(foundPsico));
          setCurrentPsico(foundPsico);
          setIsLoggingIn(false);
        } catch (err) {
          setLoginError('Error al iniciar sesión: ' + err.message);
          setIsLoggingIn(false);
        }
      };

      // Manejador de Logout
      const handleLogout = () => {
        localStorage.removeItem(STORAGE_SESSION);
        setCurrentPsico(null);
      };

      // Guardar cambios del perfil del especialista
      const handleUpdatePsychologist = async (updatedData) => {
        const merged = { ...currentPsico, ...updatedData };
        setCurrentPsico(merged);
        localStorage.setItem(STORAGE_SESSION, JSON.stringify(merged));

        // Actualizar en Firestore
        if (firestoreDb && merged.id) {
          try {
            await firestoreDb.collection(COLLECTION_PSYCHOLOGISTS).doc(merged.id).set(merged, { merge: true });
          } catch (e) {
            console.error('Error guardando en Firestore:', e);
          }
        }

        // Actualizar en la lista local de psicólogos del Admin
        try {
          const raw = localStorage.getItem('@admin_entrenosotros_psychologists_list_v1');
          if (raw) {
            let list = JSON.parse(raw);
            const idx = list.findIndex(p => p.id === merged.id);
            if (idx >= 0) {
              list[idx] = merged;
            } else {
              list.push(merged);
            }
            localStorage.setItem('@admin_entrenosotros_psychologists_list_v1', JSON.stringify(list));
          }
        } catch (e) {}
      };

      // ======================================================================
      // RENDER: PANTALLA DE LOGIN
      // ======================================================================
      if (!currentPsico) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-coffee-100 via-coffee-50 to-emerald-50">
            <div className="max-w-md w-full bg-white rounded-3xl shadow-xl border border-coffee-200 p-8 space-y-6">
              {/* Logo y Encabezado */}
              <div className="text-center space-y-2">
                <div className="inline-flex p-3 rounded-2xl bg-coffee-100 border border-coffee-200 shadow-inner">
                  <img src="https://iili.io/nlMffqB.png" alt="Entre Nosotros" className="w-12 h-12 rounded-xl object-cover" />
                </div>
                <h1 className="text-2xl font-extrabold text-coffee-900 tracking-tight">Portal del Psicólogo</h1>
                <p className="text-xs text-coffee-600 font-medium">
                  Crea y personaliza tu perfil profesional para aparecer en la aplicación <span className="font-bold text-coffee-800">Entre Nosotros</span>
                </p>
              </div>

              {loginError && (
                <div className="p-3.5 bg-red-50 border border-red-200 text-red-700 text-xs rounded-xl font-medium">
                  {loginError}
                </div>
              )}

              <form onSubmit={handleLogin} className="space-y-4">
                <div>
                  <label className="block text-xs font-bold text-coffee-800 uppercase tracking-wider mb-1">
                    Correo Electrónico
                  </label>
                  <input
                    type="email"
                    value={loginEmail}
                    onChange={(e) => setLoginEmail(e.target.value)}
                    required
                    placeholder="doctor@ejemplo.com"
                    className="w-full px-4 py-2.5 text-sm bg-coffee-50 border border-coffee-200 rounded-xl focus:ring-2 focus:ring-coffee-500 focus:bg-white transition"
                  />
                </div>

                <div>
                  <label className="block text-xs font-bold text-coffee-800 uppercase tracking-wider mb-1">
                    Contraseña de Acceso
                  </label>
                  <input
                    type="password"
                    value={loginPassword}
                    onChange={(e) => setLoginPassword(e.target.value)}
                    required
                    placeholder="••••••••"
                    className="w-full px-4 py-2.5 text-sm bg-coffee-50 border border-coffee-200 rounded-xl focus:ring-2 focus:ring-coffee-500 focus:bg-white transition"
                  />
                  <p className="text-[11px] text-coffee-500 mt-1">
                    Ingresa con la clave temporal asignada al darte de alta en el sistema.
                  </p>
                </div>

                <button
                  type="submit"
                  disabled={isLoggingIn}
                  className="w-full py-3 bg-coffee-700 hover:bg-coffee-800 text-white font-bold text-sm rounded-xl shadow-md hover:shadow-lg transition flex items-center justify-center gap-2"
                >
                  <Icon name="user" size={16} />
                  {isLoggingIn ? 'Verificando credenciales...' : 'Ingresar a mi Perfil'}
                </button>
              </form>

              <div className="pt-4 border-t border-coffee-100 text-center">
                <p className="text-[11px] text-coffee-500">
                  Red de Psicólogos Especialistas · Entre Nosotros Salud Mental
                </p>
              </div>
            </div>
          </div>
        );
      }

      // ======================================================================
      // RENDER: PANEL PRINCIPAL CON PERFIL Y VISTA PREVIA
      // ======================================================================
      return (
        <div className="min-h-screen flex flex-col">
          {/* Barra Superior de Navegación */}
          <header className="bg-white border-b border-coffee-200 sticky top-0 z-30 shadow-sm">
            <div className="max-w-6xl w-full mx-auto px-4 py-3 flex items-center justify-between gap-4">
              {/* Marca */}
              <div className="flex items-center gap-3">
                <img src="https://iili.io/nlMffqB.png" alt="Logo" className="w-10 h-10 rounded-xl border border-coffee-300 shadow-sm" />
                <div>
                  <div className="flex items-center gap-1.5">
                    <span className="font-extrabold text-sm text-coffee-900 tracking-tight">Entre Nosotros</span>
                    <span className="px-2 py-0.5 rounded-full text-[10px] font-bold bg-coffee-100 text-coffee-800 border border-coffee-200">
                      Portal Especialista
                    </span>
                  </div>
                  <p className="text-[11px] text-coffee-600 truncate max-w-[200px] md:max-w-none">
                    {currentPsico.nombre} · {currentPsico.especialidad || 'Psicología'}
                  </p>
                </div>
              </div>

              {/* Botones de Navegación (Mi Perfil, Vista Previa Tarjeta, Compartir, Cerrar Sesión) */}
              <div className="flex items-center gap-1.5">
                <button
                  onClick={() => setActiveTab('perfil')}
                  className={`flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-bold transition whitespace-nowrap ${
                    activeTab === 'perfil'
                      ? 'bg-coffee-700 text-white shadow-sm'
                      : 'text-coffee-700 hover:bg-coffee-100'
                  }`}
                >
                  <Icon name="user" size={14} />
                  <span>Mi Perfil</span>
                </button>

                <button
                  onClick={() => setActiveTab('vista_previa')}
                  className={`flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-bold transition whitespace-nowrap ${
                    activeTab === 'vista_previa'
                      ? 'bg-coffee-700 text-white shadow-sm'
                      : 'text-coffee-700 hover:bg-coffee-100'
                  }`}
                >
                  <Icon name="eye" size={14} />
                  <span>Vista Previa Tarjeta</span>
                </button>

                <button
                  onClick={() => setActiveTab('compartir')}
                  className={`flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-bold transition whitespace-nowrap ${
                    activeTab === 'compartir'
                      ? 'bg-coffee-700 text-white shadow-sm'
                      : 'text-coffee-700 hover:bg-coffee-100'
                  }`}
                >
                  <Icon name="share" size={14} />
                  <span>Compartir</span>
                </button>

                <button
                  onClick={handleLogout}
                  className="flex items-center gap-1 px-2.5 py-1.5 text-xs font-bold text-red-600 hover:bg-red-50 rounded-xl transition whitespace-nowrap ml-1"
                  title="Cerrar Sesión"
                >
                  <Icon name="logout" size={14} />
                  <span className="hidden sm:inline">Salir</span>
                </button>
              </div>
            </div>
          </header>

          {/* Contenido Central */}
          <main className="max-w-6xl w-full mx-auto px-4 py-6 flex-1">
            {activeTab === 'perfil' && (
              <ViewMiPerfil
                psychologist={currentPsico}
                onSave={handleUpdatePsychologist}
              />
            )}

            {activeTab === 'vista_previa' && (
              <ViewFullCardPreview
                psychologist={currentPsico}
                onGoToEdit={() => setActiveTab('perfil')}
              />
            )}

            {activeTab === 'compartir' && (
              <ViewCompartir
                psychologist={currentPsico}
              />
            )}
          </main>
        </div>
      );
    }

    // ========================================================================
    // SECCIÓN 1: MI PERFIL (FORMULARIO EXACTO DE REGISTRO_PSICOLOGOS.HTML + LIVE PREVIEW)
    // ========================================================================
    function ViewMiPerfil({ psychologist, onSave }) {
      const [nombre, setNombre] = useState(psychologist.nombre || '');
      const [especialidad, setEspecialidad] = useState(psychologist.especialidad || '');
      const [descripcion, setDescripcion] = useState(psychologist.descripcion || '');
      const [modalidad, setModalidad] = useState(psychologist.modalidad || 'Presencial y En línea');
      const [temas, setTemas] = useState(psychologist.temas || []);
      const [correo, setCorreo] = useState(psychologist.correo || '');
      const [whatsapp, setWhatsapp] = useState(psychologist.whatsapp || psychologist.telefono || '');
      const [ciudad, setCiudad] = useState(psychologist.ciudad || '');
      const [sitioWeb, setSitioWeb] = useState(psychologist.sitioWeb || '');
      const [ubicacion, setUbicacion] = useState(psychologist.ubicacion || '');
      const [imagen, setImagen] = useState(psychologist.imagen || '');
      const [fotoPortada, setFotoPortada] = useState(psychologist.fotoPortada || '');

      const [availableTopics, setAvailableTopics] = useState(DEFAULT_TOPICS_REF);
      const [topicInput, setTopicInput] = useState('');
      const [isSaving, setIsSaving] = useState(false);
      const [savedAlert, setSavedAlert] = useState(false);

      // Cargar temas registrados en Firestore (temas_psicologia)
      useEffect(() => {
        if (!firestoreDb) return;
        firestoreDb.collection(COLLECTION_TOPICS).get()
          .then((snap) => {
            const list = [...DEFAULT_TOPICS_REF];
            snap.forEach((doc) => {
              const t = doc.data().nombre;
              if (t && !list.includes(t)) {
                list.push(t);
              }

                    <span
                      key={i}
                      className="px-2.5 py-1 bg-coffee-100 text-coffee-800 border border-coffee-200 text-[11px] font-bold rounded-lg flex items-center gap-1"
                    >
                      <Icon name="check" size={10} className="text-coffee-600" />
                      {t}
                    </span>
                  ))}
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ========================================================================
    // SECCIÓN 2: VISTA PREVIA COMPLETA
    // ========================================================================
    function ViewFullCardPreview({ psychologist, onGoToEdit }) {
      return (
        <div className="max-w-xl mx-auto space-y-4">
          <div className="flex items-center justify-between">
            <h2 className="text-lg font-bold text-coffee-900">Vista Previa de tu Tarjeta en la App</h2>
            <button
              onClick={onGoToEdit}
              className="px-3.5 py-1.5 bg-coffee-700 hover:bg-coffee-800 text-white rounded-xl text-xs font-bold transition shadow-sm"
            >
              Editar mis Datos
            </button>
          </div>
          <AppCardView psychologist={psychologist} />
        </div>
      );
    }

    // ========================================================================
    // SECCIÓN 3: COMPARTIR ENLACE DEL PERFIL
    // ========================================================================
    function ViewCompartir({ psychologist }) {
      const [copied, setCopied] = useState(false);
      const url = window.location.href;

      const handleCopy = () => {
        navigator.clipboard.writeText(url);
        setCopied(true);
        setTimeout(() => setCopied(false), 2500);
      };

      return (
        <div className="max-w-xl mx-auto bg-white rounded-3xl p-6 md:p-8 border border-coffee-200 shadow-sm space-y-6">
          <div className="text-center space-y-2">
            <div className="w-12 h-12 rounded-2xl bg-coffee-100 text-coffee-700 flex items-center justify-center mx-auto">
              <Icon name="share" size={24} />
            </div>
            <h2 className="text-xl font-extrabold text-coffee-900">Enlace de tu Perfil y Tarjeta</h2>
            <p className="text-xs text-coffee-600">
              Utiliza este enlace para ingresar directamente a editar tus datos o compartir tu tarjeta profesional.
            </p>
          </div>

          <div className="p-3.5 bg-coffee-50 border border-coffee-200 rounded-2xl flex items-center justify-between gap-3">
            <span className="text-xs font-mono text-coffee-800 truncate select-all">{url}</span>
            <button
              onClick={handleCopy}
              className="px-4 py-2 bg-coffee-700 hover:bg-coffee-800 text-white text-xs font-bold rounded-xl transition flex items-center gap-1.5 flex-shrink-0"
            >
              <Icon name={copied ? 'check' : 'copy'} size={14} />
              {copied ? '¡Copiado!' : 'Copiar'}
            </button>
          </div>
        </div>
      );
    }

    // Montar aplicación
    ReactDOM.render(<PortalApp />, document.getElementById('root'));
  </script>
</body>
</html>
