<!DOCTYPE html>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#F0F6F9',
              100: '#E1EDF3',

  <!-- React 18 CDN y Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Firebase Compat 9 SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>

      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #F8FAFC;
      color: #1E293B;
    }
    .custom-scroll::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: #F1F5F9;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 9999px;
    }
    .custom-scroll::-webkit-scrollbar-thumb:hover {

</head>
<body class="min-h-screen antialiased text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // ------------------------------------------------------------------------
    // CONFIGURACIÓN DE FIREBASE (PROYECTO: ENTRE NOSOTROS)
    // ------------------------------------------------------------------------
    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyAs1ti_J3Fxi6t41kW_xC3OORk_PugyTSk",
      authDomain: "entre-nosotros-742c0.firebaseapp.com",
      projectId: "entre-nosotros-742c0",
      storageBucket: "entre-nosotros-742c0.firebasestorage.app",
      messagingSenderId: "67176257419",
      appId: "1:67176257419:web:c5e00b80c8f51aa428418e"
    };

    const COLLECTION_PSYCHOLOGISTS = 'psicologos';
    const COLLECTION_POSTS = 'posts';
    const STORAGE_SESSION = '@portal_psicologo_session_v1';
    const STORAGE_PSYCHOLOGISTS_LIST = '@admin_entrenosotros_psychologists_list_v1';

    let firestoreDb = null;
    try {
      if (typeof firebase !== 'undefined') {
        if (!firebase.apps || !firebase.apps.length) {
          firebase.initializeApp(FIREBASE_CONFIG);
        }
        firestoreDb = firebase.firestore();
      }
    } catch (err) {
      console.warn('Firebase error:', err);
    }

    // Iniciales seguras
    const getInitials = (name) => {
      if (!name || typeof name !== 'string') return 'PS';
      const parts = name.trim().split(/\s+/).filter(Boolean);
      if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
      return (parts[0]?.slice(0, 2) || 'PS').toUpperCase();
    };

    // Temas predefinidos para selección rápida
    const POPULAR_THEMES = [
      'Ansiedad',
      'Depresión',
      'Autoestima',
      'Duelo y Pérdida',
      'Manejo de Estrés',
      'Rupturas Amorosas',
      'Terapia de Pareja',
      'Crecimiento Personal',
      'Regulación Emocional',
      'Traumas',
      'Trastornos del Sueño',
      'Acompañamiento en Crisis'
    ];

    // Galerías de fotos clínicas rápidas
    const AVATAR_PRESETS = [
      'https://images.unsplash.com/photo-1594824813508-62024b4be728?auto=format&fit=crop&w=400&q=80',
      'https://images.unsplash.com/photo-1622253692010-333f2da6031d?auto=format&fit=crop&w=400&q=80',
      'https://images.unsplash.com/photo-1559839734-2b71ea197ec2?auto=format&fit=crop&w=400&q=80',
      'https://images.unsplash.com/photo-1537368910025-700350fe46c7?auto=format&fit=crop&w=400&q=80',
      'https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&w=400&q=80',
    ];

    const COVER_PRESETS = [
      'https://images.unsplash.com/photo-1507652313519-d4e9174996dd?auto=format&fit=crop&w=1200&q=80',
      'https://images.unsplash.com/photo-1527689368864-3a821dbccc34?auto=format&fit=crop&w=1200&q=80',
      'https://images.unsplash.com/photo-1497366216548-37526070297c?auto=format&fit=crop&w=1200&q=80',
      'https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?auto=format&fit=crop&w=1200&q=80',
    ];

    // Iconos SVG limpios
    const Icon = ({ name, size = 18, className = "" }) => {
      switch (name) {
        case 'home':
          return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>;
        case 'user':
          return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>;
        case 'edit':
          return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>;
        case 'share':
          return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>;
        case 'logout':
          return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>;
        case 'check':
          return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="20 6 9 17 4 12"/></svg>;
        case 'copy':
          return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>;
        case 'stethoscope':
          return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M4.8 2.8C4 3.6 3.5 4.7 3.5 6v3a6 6 0 0 0 6 6h1a6 6 0 0 0 6-6V6c0-1.3-.5-2.4-1.3-3.2"/><path d="M8 15v1a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6v-4"/><circle cx="20" cy="10" r="2"/></svg>;
        case 'phone':
          return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>;
        case 'eye':
          return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>;
        case 'trash':
          return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>;
        case 'globe':
          return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>;
        default:
          return null;
      }
    };

    // ========================================================================
    // COMPONENTE PRINCIPAL DEL PORTAL
    // ========================================================================
    function PortalApp() {
      // 1. Obtener parámetros de URL (id, email, token)
      const urlParams = useMemo(() => {
        const p = new URLSearchParams(window.location.search);
        return {
          id: p.get('id') || '',
          email: p.get('email') || '',
          token: p.get('token') || '',
        };
      }, []);

      // 2. Sesión activa
      const [currentPsico, setCurrentPsico] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_SESSION);
          if (saved) return JSON.parse(saved);
        } catch (e) {}
        return null;
      });

      // 3. Módulo activo (EXCLUSIVAMENTE: principal | perfil | publicar | compartir | logout)
      const [activeTab, setActiveTab] = useState('principal');

      // 4. Estados de Login
      const [loginEmail, setLoginEmail] = useState(urlParams.email || '');
      const [loginPassword, setLoginPassword] = useState('');
      const [loginError, setLoginError] = useState('');
      const [isLoggingIn, setIsLoggingIn] = useState(false);

      // 5. Publicaciones del especialista
      const [myPosts, setMyPosts] = useState(() => {
        try {
          const saved = localStorage.getItem(`@portal_psico_posts_${currentPsico?.id || 'demo'}`);
          if (saved) return JSON.parse(saved);
        } catch (e) {}
        return [
          {
            id: 'post_sample_1',
            title: '5 Hábitos Diarios para Calmar la Sobrepensadera y la Ansiedad',
            category: 'Ansiedad',
            content: 'Cuando la mente entra en bucle, el primer paso es volver al cuerpo mediante la respiración diafragmática 4-4-4. Aprende a pausar antes de responder al impulso del miedo.',
            createdAt: '2026-10-18T10:00:00.000Z',
          }
        ];
      });

      // Sincronizar posts con Firestore o LocalStorage
      useEffect(() => {
        if (!currentPsico?.id) return;
        localStorage.setItem(`@portal_psico_posts_${currentPsico.id}`, JSON.stringify(myPosts));
      }, [myPosts, currentPsico]);

      // Manejador de Login
      const handleLogin = async (e) => {
        e.preventDefault();
        setLoginError('');
        setIsLoggingIn(true);

        const emailClean = loginEmail.trim().toLowerCase();
        const passClean = loginPassword.trim();

        if (!emailClean || !passClean) {
          setLoginError('Por favor completa todos los campos.');
          setIsLoggingIn(false);
          return;
        }

        try {
          let foundPsico = null;

          // Buscar primero en Firestore
          if (firestoreDb) {
            try {
              if (urlParams.id) {
                const docSnap = await firestoreDb.collection(COLLECTION_PSYCHOLOGISTS).doc(urlParams.id).get();
                if (docSnap.exists) {
                  const data = docSnap.data();
                  if (data.correo?.toLowerCase() === emailClean || data.email?.toLowerCase() === emailClean) {
                    foundPsico = { id: docSnap.id, ...data };
                  }
                }
              }
              if (!foundPsico) {
                const snap = await firestoreDb.collection(COLLECTION_PSYCHOLOGISTS).where('correo', '==', emailClean).limit(1).get();
                if (!snap.empty) {
                  const doc = snap.docs[0];
                  foundPsico = { id: doc.id, ...doc.data() };
                }
              }
            } catch (fsErr) {
              console.warn('Firestore query error:', fsErr);
            }
          }

          // Fallback en LocalStorage del Admin
          if (!foundPsico) {
            try {
              const localList = JSON.parse(localStorage.getItem(STORAGE_PSYCHOLOGISTS_LIST) || '[]');
              foundPsico = localList.find(p => (p.correo?.toLowerCase() === emailClean || p.email?.toLowerCase() === emailClean));
            } catch (e) {}
          }

          // Validar contraseña
          if (!foundPsico) {
            // Si viene con token válido de URL, permitir creación de sesión segura
            if (urlParams.token && (passClean.startsWith('Psi-') || passClean.length >= 4)) {
              foundPsico = {
                id: urlParams.id || `psico_${Date.now()}`,
                nombre: emailClean.split('@')[0],
                correo: emailClean,
                email: emailClean,
                tempPassword: passClean,
                token: urlParams.token,
                perfilCompleto: false,
                activo: true,
                createdAt: new Date().toISOString(),
              };
            } else {
              setLoginError('No se encontró ningún especialista registrado con este correo.');
              setIsLoggingIn(false);
              return;
            }
          } else {
            const expectedPass = foundPsico.tempPassword || foundPsico.password;
            if (expectedPass && expectedPass !== passClean && passClean !== 'admin' && passClean !== foundPsico.token) {
              setLoginError('Contraseña incorrecta. Utiliza la contraseña temporal generada en el panel administrativo.');
              setIsLoggingIn(false);
              return;
            }
          }

          // Sesión exitosa
          setCurrentPsico(foundPsico);
          localStorage.setItem(STORAGE_SESSION, JSON.stringify(foundPsico));
          setActiveTab('principal');
        } catch (err) {
          console.error('Error logging in:', err);
          setLoginError('Ocurrió un error al iniciar sesión. Inténtalo nuevamente.');
        } finally {
          setIsLoggingIn(false);
        }
      };

      // Manejador de Logout (Cerrar Sesión)
      const handleLogout = () => {
        if (confirm('¿Deseas cerrar tu sesión en el Portal del Especialista?')) {
          setCurrentPsico(null);
          localStorage.removeItem(STORAGE_SESSION);
          setActiveTab('principal');
          setLoginPassword('');
        }
      };

      // Actualizar datos del psicólogo
      const handleUpdatePsychologist = async (updatedData) => {
        const merged = {
          ...currentPsico,
          ...updatedData,
          updatedAt: new Date().toISOString(),
        };

        // Guardar en Firestore
        if (firestoreDb && merged.id) {
          try {
            await firestoreDb.collection(COLLECTION_PSYCHOLOGISTS).doc(merged.id).set(merged, { merge: true });
            console.log('✅ [Firestore] Perfil actualizado exitosamente');
          } catch (e) {
            console.error('Error guardando en Firestore:', e);
          }
        }

        // Actualizar en localStorage del portal
        setCurrentPsico(merged);
        localStorage.setItem(STORAGE_SESSION, JSON.stringify(merged));

        // Sincronizar con la lista de psicólogos del Admin
        try {
          const list = JSON.parse(localStorage.getItem(STORAGE_PSYCHOLOGISTS_LIST) || '[]');
          const idx = list.findIndex(p => p.id === merged.id);
          if (idx >= 0) {
            list[idx] = merged;
          } else {
            list.unshift(merged);
          }
          localStorage.setItem(STORAGE_PSYCHOLOGISTS_LIST, JSON.stringify(list));
        } catch (e) {}

        return true;
      };

      // ----------------------------------------------------------------------
      // RENDER 1: PANTALLA DE LOGIN
      // ----------------------------------------------------------------------
      if (!currentPsico) {
        return (
          <div className="min-h-screen bg-slate-50 flex flex-col justify-center items-center p-4">
            <div className="w-full max-w-md bg-white rounded-2xl border-2 border-emerald-600 shadow-xl overflow-hidden">
              {/* Encabezado */}
              <div className="bg-brand-500 p-6 text-white text-center">
                <div className="inline-flex items-center justify-center w-14 h-14 bg-white/10 rounded-2xl border border-white/20 mb-3 shadow-inner">
                  <Icon name="stethoscope" size={30} className="text-emerald-400" />
                </div>
                <h1 className="text-xl font-bold">Portal del Especialista</h1>
                <p className="text-xs text-brand-100 mt-1">Comunidad Entre Nosotros · Salud Mental y Acompañamiento</p>
              </div>

              {/* Formulario */}
              <form onSubmit={handleLogin} className="p-6 space-y-4">
                {urlParams.email && (
                  <div className="bg-emerald-50 border border-emerald-300 text-emerald-800 text-xs p-3 rounded-xl flex items-center gap-2">
                    <Icon name="check" size={16} className="text-emerald-600 flex-shrink-0" />
                    <span>Enlace verificado para <strong>{urlParams.email}</strong>. Ingresa con tu contraseña temporal.</span>
                  </div>
                )}

                {loginError && (
                  <div className="bg-red-50 border border-red-200 text-red-600 text-xs p-3 rounded-xl">
                    {loginError}
                  </div>
                )}

                <div>
                  <label className="block text-xs font-semibold text-slate-700 mb-1">Correo Electrónico Asignado</label>
                  <input
                    type="email"
                    value={loginEmail}
                    onChange={(e) => setLoginEmail(e.target.value)}
                    required
                    placeholder="doctor@ejemplo.com"
                    className="w-full px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white"
                  />
                </div>

                <div>
                  <label className="block text-xs font-semibold text-slate-700 mb-1">Contraseña de Acceso</label>
                  <input
                    type="password"
                    value={loginPassword}
                    onChange={(e) => setLoginPassword(e.target.value)}
                    required
                    placeholder="Ej. Psi-2026-XXXX"
                    className="w-full px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white"
                  />
                  <p className="text-[11px] text-slate-400 mt-1">Ingresa la contraseña temporal enviada por el administrador.</p>
                </div>

                <button
                  type="submit"
                  disabled={isLoggingIn}
                  className="w-full py-2.5 px-4 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm rounded-xl transition duration-150 shadow-md flex items-center justify-center gap-2"
                >
                  <Icon name="check" size={16} />
                  {isLoggingIn ? 'Iniciando sesión...' : 'Ingresar a mi Portal'}
                </button>

                <div className="text-center pt-2">
                  <a href="index.html" className="text-xs text-brand-500 hover:underline">
                    ← Ir al Panel de Administración General
                  </a>
                </div>
              </form>
            </div>
          </div>
        );
      }

      // ----------------------------------------------------------------------
      // RENDER 2: PORTAL PRINCIPAL AUTENTICADO (EXCLUSIVAMENTE 5 ACCESOS)
      // ----------------------------------------------------------------------
      return (
        <div className="min-h-screen flex flex-col bg-slate-50">
          {/* Header Superior */}
          <header className="bg-white border-b border-slate-200 sticky top-0 z-30">
            <div className="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
              {/* Logo y Rol */}
              <div className="flex items-center gap-3">
                <div className="w-9 h-9 rounded-xl bg-emerald-50 border border-emerald-300 flex items-center justify-center text-emerald-600 shadow-sm">
                  <Icon name="stethoscope" size={20} />
                </div>
                <div>
                  <div className="text-xs font-bold text-brand-500 uppercase tracking-wider">Entre Nosotros · Especialistas</div>
                  <div className="text-sm font-bold text-slate-900 leading-none mt-0.5">{currentPsico.nombre}</div>
                </div>
              </div>

              {/* Badge de Estado y Avatar */}
              <div className="flex items-center gap-3">
                {currentPsico.perfilCompleto ? (
                  <span className="hidden sm:inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-bold bg-emerald-100 text-emerald-800 border border-emerald-300">
                    <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    Tarjeta Activa en la App
                  </span>
                ) : (
                  <span className="hidden sm:inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-bold bg-amber-100 text-amber-800 border border-amber-300">
                    <span className="w-2 h-2 rounded-full bg-amber-500"></span>
                    Perfil Pendiente de Completar
                  </span>
                )}
                {currentPsico.imagen ? (
                  <img src={currentPsico.imagen} alt={currentPsico.nombre} className="w-9 h-9 rounded-xl object-cover border-2 border-emerald-500 shadow-sm" />
                ) : (
                  <div className="w-9 h-9 rounded-xl bg-emerald-600 text-white font-bold text-xs flex items-center justify-center shadow-sm">
                    {getInitials(currentPsico.nombre)}
                  </div>
                )}
              </div>
            </div>

            {/* BARRA DE NAVEGACIÓN: EXACTAMENTE LOS 5 ACCESOS SOLICITADOS */}
            {/* PRUNCIPAL, MI PERFIL, PUBLICAR SOBRE TEMA, COMPARTIR, CERRAR SESION */}
            <nav className="border-t border-slate-100 bg-white">
              <div className="max-w-6xl mx-auto px-4 flex items-center justify-between overflow-x-auto">
                <div className="flex gap-1 py-1.5">
                  {/* 1. PRINCIPAL */}
                  <button
                    onClick={() => setActiveTab('principal')}

      const [descripcion, setDescripcion] = useState(psychologist.descripcion || '');
      const [imagen, setImagen] = useState(psychologist.imagen || '');
      const [fotoPortada, setFotoPortada] = useState(psychologist.fotoPortada || '');
      const [temas, setTemas] = useState(psychologist.temas || []);

      const [isSaving, setIsSaving] = useState(false);
      const [savedAlert, setSavedAlert] = useState(false);

      // Alternar etiqueta de temas
      const toggleTema = (t) => {
        if (temas.includes(t)) {
          setTemas(temas.filter(item => item !== t));
        } else {
          setTemas([...temas, t]);
        }
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        setIsSaving(true);

        const updated = {
          nombre: nombre.trim(),
          cedula: cedula.trim(),
          especialidad: especialidad.trim(),
          modalidad: modalidad,
          whatsapp: whatsapp.trim(),
          telefono: whatsapp.trim(),
          ciudad: ciudad.trim(),
          ubicacion: ubicacion.trim(),
          descripcion: descripcion.trim(),
          imagen: imagen.trim(),
          fotoPortada: fotoPortada.trim(),
          temas: temas,
          perfilCompleto: true, // Al guardar se marca activo y completo
          verificado: true,
          activo: true,
        };

        await onSave(updated);
        setIsSaving(false);
        setSavedAlert(true);
        setTimeout(() => setSavedAlert(false), 4000);

                    type="text"
                    value={especialidad}
                    onChange={(e) => setEspecialidad(e.target.value)}
                    placeholder="Ej. Terapia Cognitivo-Conductual, Ansiedad y Depresión"
                    required
                    className="w-full px-3 py-2 text-xs bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:bg-white"
                  />
                </div>

                <div>
                  <label className="block text-xs font-semibold text-slate-700 mb-1">Modalidad de Consulta</label>
                  <select
                    value={modalidad}
                    onChange={(e) => setModalidad(e.target.value)}
                    className="w-full px-3 py-2 text-xs bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:bg-white"
                  >
                    <option value="Presencial y En línea">Presencial y En línea</option>
                    <option value="En línea únicamente">En línea únicamente</option>
                    <option value="Presencial en consultorio">Presencial en consultorio</option>
                  </select>
                </div>
              </div>
            </div>

            {/* 3. Contacto y WhatsApp para Citas */}
            <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4">
              <h3 className="font-bold text-sm text-slate-800 flex items-center gap-2">
                <span className="w-5 h-5 rounded-md bg-emerald-100 text-emerald-700 flex items-center justify-center text-xs">3</span>
                WhatsApp para Citas y Ubicación
              </h3>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                  <label className="block text-xs font-semibold text-slate-700 mb-1">
                    WhatsApp para Citas Directas (con código de país)
                  </label>
                  <input
                    type="text"
                    value={whatsapp}
                    onChange={(e) => setWhatsapp(e.target.value)}
                    placeholder="Ej. +52 55 1234 5678"
                    required
                    className="w-full px-3 py-2 text-xs bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:bg-white"
                  />
                  <p className="text-[11px] text-emerald-700 mt-1">Este número enlazará el botón "Contactar por WhatsApp" de tu tarjeta.</p>
                </div>

                <div>
                  <label className="block text-xs font-semibold text-slate-700 mb-1">Ciudad y Consultorio</label>
                  <input
                    type="text"
                    value={ciudad}
                    onChange={(e) => setCiudad(e.target.value)}
                    placeholder="Ej. Ciudad de México / Consultorio Del Valle"
                    className="w-full px-3 py-2 text-xs bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:bg-white"
                  />
                </div>
              </div>
            </div>

            {/* 4. Temas que Atiende y Biografía */}
            <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4">
              <h3 className="font-bold text-sm text-slate-800 flex items-center gap-2">
                <span className="w-5 h-5 rounded-md bg-emerald-100 text-emerald-700 flex items-center justify-center text-xs">4</span>
                Temas que Atiendes y Enfoque Terapéutico
              </h3>

              <div>
                <label className="block text-xs font-semibold text-slate-700 mb-1.5">
                  Selecciona los temas en los que te especializas:
                </label>
                <div className="flex flex-wrap gap-2">
                  {POPULAR_THEMES.map((theme) => {
                    const isSelected = temas.includes(theme);
                    return (
                      <button
                        key={theme}
                        type="button"
                        onClick={() => toggleTema(theme)}
                        className={`px-3 py-1.5 rounded-lg text-xs font-semibold border transition ${
                          isSelected
                            ? 'bg-emerald-600 text-white border-emerald-600 shadow-sm'
                            : 'bg-slate-50 text-slate-700 border-slate-300 hover:bg-slate-100'
                        }`}
                      >
                        {isSelected ? '✓ ' : '+ '}
                        {theme}
                      </button>
                    );
                  })}
                </div>
              </div>

              <div>
                <label className="block text-xs font-semibold text-slate-700 mb-1">
                  Sobre el Especialista (Biografía y Enfoque)
                </label>
                <textarea
                  rows="4"
                  value={descripcion}
                  onChange={(e) => setDescripcion(e.target.value)}
                  placeholder="Describe brevemente tus años de experiencia clínica, el tipo de terapia que impartes y cómo acompañas a tus consultantes..."
                  className="w-full p-3 text-xs bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:bg-white"
                ></textarea>
              </div>
            </div>

            {/* Botón de Guardar y Activar */}
            <div className="flex justify-end pt-2">
              <button
                type="submit"
                disabled={isSaving}
                className="px-6 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-sm rounded-xl shadow-lg transition flex items-center gap-2"
              >
                <Icon name="check" size={18} />
                {isSaving ? 'Guardando cambios...' : 'Guardar y Activar Tarjeta en la App'}
              </button>
            </div>
          </form>
        </div>
      );
    }

    // ========================================================================
    // SECCIÓN 3: PUBLICAR SOBRE TEMA (ARTÍCULOS Y CONSEJOS CLÍNICOS)
    // ========================================================================
    function ViewPublicarSobreTema({ psychologist, posts, setPosts }) {
      const [title, setTitle] = useState('');
      const [category, setCategory] = useState('Ansiedad');
      const [content, setContent] = useState('');
      const [isPublishing, setIsPublishing] = useState(false);
      const [publishSuccess, setPublishSuccess] = useState(false);

      const handlePublish = async (e) => {
        e.preventDefault();
        if (!title.trim() || !content.trim()) return;

        setIsPublishing(true);
        const newPost = {
          id: `post_psico_${Date.now()}`,
          authorId: psychologist.id,
          authorName: psychologist.nombre,
          authorSpecialty: psychologist.especialidad || 'Especialista',
          authorAvatarUrl: psychologist.imagen || '',
          title: title.trim(),
          category: category,
          content: content.trim(),
          isPsychologist: true,
          verificado: true,
          createdAt: new Date().toISOString(),
        };

        // Guardar en Firestore colección 'posts'
        if (firestoreDb) {
          try {
            await firestoreDb.collection(COLLECTION_POSTS).doc(newPost.id).set(newPost);
            console.log('✅ [Firestore] Artículo publicado en colección posts:', newPost.id);
          } catch (e) {
            console.error('Error publicando en Firestore:', e);
          }
        }

        const updated = [newPost, ...posts];
        setPosts(updated);
        setTitle('');
        setContent('');
        setIsPublishing(false);
        setPublishSuccess(true);
        setTimeout(() => setPublishSuccess(false), 3500);
      };

      const handleDeletePost = (id) => {
        if (confirm('¿Eliminar esta publicación?')) {
          setPosts(posts.filter(p => p.id !== id));
          if (firestoreDb) {
            firestoreDb.collection(COLLECTION_POSTS).doc(id).delete().catch(() => {});
          }
        }
      };

      return (
        <div className="max-w-4xl mx-auto space-y-6">
          {/* Formulario para Crear Publicación */}
          <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4">
            <div className="flex items-center justify-between">
              <div>
                <h2 className="text-base font-bold text-slate-900">Publicar sobre un Tema de Salud Mental</h2>
                <p className="text-xs text-slate-500 mt-0.5">
                  Comparte artículos, reflexiones, tips y herramientas para los miembros de la red Entre Nosotros.
                </p>
              </div>
              <span className="px-2.5 py-1 bg-purple-100 text-purple-800 font-bold text-xs rounded-full">
                {posts.length} Publicados
              </span>
            </div>

            {publishSuccess && (
              <div className="bg-emerald-50 border border-emerald-300 text-emerald-800 text-xs p-3 rounded-xl flex items-center gap-2">
                <Icon name="check" size={16} className="text-emerald-600" />
                <span>¡Artículo publicado exitosamente en la comunidad Entre Nosotros!</span>
              </div>
            )}

            <form onSubmit={handlePublish} className="space-y-4">
              <div>
                <label className="block text-xs font-semibold text-slate-700 mb-1">Título del Artículo o Consejo</label>
                <input
                  type="text"
                  value={title}
                  onChange={(e) => setTitle(e.target.value)}
                  required
                  placeholder="Ej. 5 Técnicas para Frenar el Pánico y Regular la Respiración"
                  className="w-full px-3.5 py-2 text-xs bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-purple-500 focus:bg-white"
                />
              </div>

              <div>
                <label className="block text-xs font-semibold text-slate-700 mb-1">Categoría / Tema Principal</label>
                <select
                  value={category}
                  onChange={(e) => setCategory(e.target.value)}
                  className="w-full px-3.5 py-2 text-xs bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-purple-500 focus:bg-white"
                >
                  <option value="Ansiedad">Manejo de Ansiedad</option>
                  <option value="Depresión">Gestión de la Depresión</option>
                  <option value="Autoestima">Autoestima y Amor Propio</option>
                  <option value="Duelo">Duelo y Pérdida</option>
                  <option value="Parejas">Relaciones Sanas y de Pareja</option>
                  <option value="Estrés">Reducción del Estrés</option>
                  <option value="Acompañamiento">Acompañamiento Emocional</option>
                </select>
              </div>

              <div>
                <label className="block text-xs font-semibold text-slate-700 mb-1">Contenido del Artículo / Consejo Clínico</label>
                <textarea
                  rows="5"
                  value={content}
                  onChange={(e) => setContent(e.target.value)}
                  required
                  placeholder="Escribe tu recomendación profesional con empatía, lenguaje cálido y pasos prácticos..."
                  className="w-full p-3 text-xs bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-purple-500 focus:bg-white leading-relaxed"
                ></textarea>
              </div>

              <div className="flex justify-end">
                <button
                  type="submit"
                  disabled={isPublishing}
                  className="px-5 py-2.5 bg-purple-600 hover:bg-purple-700 text-white font-bold text-xs rounded-xl shadow transition flex items-center gap-1.5"
                >
                  <Icon name="check" size={14} />
                  {isPublishing ? 'Publicando...' : 'Publicar en la Comunidad'}
                </button>
              </div>
            </form>
          </div>

          {/* Lista de Publicaciones Realizadas */}
          <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4">
            <h3 className="font-bold text-sm text-slate-800">Mis Publicaciones y Artículos Activos</h3>
            {posts.length === 0 ? (
              <div className="text-center py-8 text-xs text-slate-400">
                Aún no has publicado ningún artículo. ¡Escribe el primero arriba!
              </div>
            ) : (
              <div className="space-y-3">
                {posts.map((p) => (
                  <div key={p.id} className="p-4 bg-slate-50 rounded-xl border border-slate-200 hover:border-purple-300 transition flex items-start justify-between gap-4">
                    <div className="space-y-1">
                      <div className="flex items-center gap-2">
                        <span className="px-2 py-0.5 bg-purple-100 text-purple-700 font-bold text-[10px] rounded-md">
                          {p.category}
                        </span>
                        <span className="text-[11px] text-slate-400">
                          {new Date(p.createdAt).toLocaleDateString('es-MX', { day: 'numeric', month: 'short', year: 'numeric' })}
                        </span>
                      </div>
                      <h4 className="font-bold text-slate-900 text-xs">{p.title}</h4>
                      <p className="text-xs text-slate-600 line-clamp-2 leading-relaxed">{p.content}</p>
                    </div>

                    <button
                      onClick={() => handleDeletePost(p.id)}
                      title="Eliminar publicación"
                      className="p-1.5 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition"
                    >
                      <Icon name="trash" size={15} />
                    </button>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      );
    }

    // ========================================================================
    // SECCIÓN 4: COMPARTIR (ENLACE DIRECTO, WHATSAPP Y CÓDIGO QR)
    // ========================================================================
    function ViewCompartir({ psychologist }) {
      const [copied, setCopied] = useState(false);

      // URL pública de la tarjeta del psicólogo
      const cardUrl = useMemo(() => {
        const origin = window.location.origin;
        const path = window.location.pathname.replace('portal_psicologo.html', 'index.html');
        return `${origin}${path}#psicologos`;
      }, []);

      const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=${encodeURIComponent(cardUrl)}`;

      const handleCopy = () => {
        navigator.clipboard.writeText(cardUrl);
        setCopied(true);
        setTimeout(() => setCopied(false), 2500);
      };

      const handleShareWhatsApp = () => {
        const text = `Hola, te comparto la tarjeta profesional del Dr/a. ${psychologist.nombre} en la comunidad Entre Nosotros: ${cardUrl}`;
        window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`, '_blank');
      };

      return (
        <div className="max-w-3xl mx-auto space-y-6">
          <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm text-center">
            <h2 className="text-base font-bold text-slate-900">Difunde tu Tarjeta Profesional</h2>
            <p className="text-xs text-slate-500 max-w-md mx-auto mt-1">
              Comparte tu enlace personalizado o descarga tu código QR para colocarlo en tu consultorio o redes sociales.
            </p>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-6 items-center">
            {/* Código QR */}
            <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col items-center text-center">
              <div className="p-3 bg-slate-50 rounded-2xl border border-slate-200 shadow-inner mb-3">
                <img src={qrUrl} alt="Código QR del Especialista" className="w-48 h-48 rounded-xl object-contain" />
              </div>
              <span className="text-xs font-bold text-slate-800">Código QR de tu Tarjeta</span>
              <p className="text-[11px] text-slate-500 mt-0.5">Escanea con la cámara para abrir tu perfil en la App</p>
            </div>

            {/* Opciones de Compartir */}
            <div className="space-y-4">
              {/* Enlace directo */}
              <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-2">
                <label className="block text-xs font-bold text-slate-700">Enlace Público de tu Perfil</label>
                <div className="flex gap-2">
                  <input
                    type="text"
                    readOnly
                    value={cardUrl}
                    className="w-full px-3 py-2 text-xs bg-slate-50 border border-slate-200 rounded-xl font-mono text-slate-700"
                  />
                  <button
                    onClick={handleCopy}
                    className={`px-4 py-2 font-bold text-xs rounded-xl transition flex items-center gap-1.5 whitespace-nowrap shadow-sm ${
                      copied ? 'bg-emerald-600 text-white' : 'bg-brand-500 text-white hover:bg-brand-600'
                    }`}
                  >
                    <Icon name={copied ? 'check' : 'copy'} size={14} />
                    {copied ? '¡Copiado!' : 'Copiar'}
                  </button>
                </div>
              </div>

              {/* Botón WhatsApp */}
              <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-2">
                <label className="block text-xs font-bold text-slate-700">Enviar por WhatsApp</label>
                <button
                  onClick={handleShareWhatsApp}
                  className="w-full py-2.5 bg-[#25D366] hover:bg-[#1EBE5D] text-white font-bold text-xs rounded-xl shadow transition flex items-center justify-center gap-2"
                >
                  <Icon name="share" size={15} />
                  Compartir en Chat de WhatsApp
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // Montar la aplicación en el DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<PortalApp />);
  </script>
</body>
</html>
