<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acceso Administrativo | Entre Nosotros</title>
  <link rel="icon" type="image/x-icon" href="../public/favicon.ico" />
  <!-- Hoja de estilos del panel administrativo -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Contenedor donde se monta la aplicación React -->
  <div id="root"></div>

  <!-- React 18 & ReactDOM 18 (Copia local sin dependencias externas) -->
  <script src="js/react.production.min.js"></script>
  <script src="js/react-dom.production.min.js"></script>

  <!-- Respaldo CDN automático si no se encuentran las librerías locales -->
  <script>
    if (!window.React) {
      document.write('<script src="https://unpkg.com/react@18/umd/react.production.min.js"><\/script>');
      document.write('<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"><\/script>');
    }
  </script>

  <!-- Aplicación principal en React -->
  <script src="js/app.js"></script>
</body>
</html>
