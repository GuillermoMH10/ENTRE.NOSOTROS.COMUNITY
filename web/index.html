<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>Entre Nosotros - Apoyo Emocional</title>
    
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#355971" />
    <meta name="description" content="Una comunidad de apoyo emocional y acompañamiento para ti." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Entre Nosotros" />
    <link rel="apple-touch-icon" href="/assets/icon.png" />
    <link rel="icon" type="image/png" href="/assets/icon.png" />

    <!-- React Native Web recommended style reset -->
    <style id="expo-reset">
      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #FAF7F5;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>

    <!-- Custom Web Scrollbar Styling (Modern web capsule design) -->
    <style id="custom-web-scrollbar">
      /* Chrome, Safari, Edge, Opera */
      ::-webkit-scrollbar {
        width: 9px !important;
        height: 9px !important;
        display: block !important;
      }
      ::-webkit-scrollbar-track {
        background: #F1F5F9 !important;
        border-radius: 9999px !important;
      }
      ::-webkit-scrollbar-thumb {
        background: #94A3B8 !important;
        border-radius: 9999px !important;
        border: 2px solid #F1F5F9 !important;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #64748B !important;
      }
      ::-webkit-scrollbar-thumb:active {
        background: #475569 !important;
      }
      ::-webkit-scrollbar-corner {
        background: transparent !important;
      }

      /* Firefox */
      html, body, #root, * {
        scrollbar-width: thin !important;
        scrollbar-color: #94A3B8 #F1F5F9 !important;
      }
    </style>
  </head>
  <body>
    <noscript>Necesitas habilitar JavaScript para ejecutar esta aplicación.</noscript>
    <div id="root"></div>
  </body>
</html>
